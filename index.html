/* =========================================================
   EXPORT: FDX (Final Draft) — an editable, industry-standard interchange
   format importable into Final Draft and most other screenwriting software
   (Celtx, WriterDuet, Highland, Fade In, etc.) so the script can continue
   being edited elsewhere.
   ========================================================= */
const FDX_TYPE_MAP={
  scene_heading:'Scene Heading', action:'Action', character:'Character',
  dialogue:'Dialogue', parenthetical:'Parenthetical', transition:'Transition',
  shot:'Shot', general:'General'
  // centered/lyrics/note are handled specially below, not via a direct 1:1 name
};
function fdxEscape(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* Walks a line's cleaned inline HTML (b/strong, i/em, u, strike/s — the same
   tags document.execCommand produces for this app's Bold/Italic/Underline/
   Strikethrough buttons) into a flat list of {text, bold, italic, underline}
   runs. FDX has no native strikethrough style, so that formatting is dropped
   for export (the text itself is preserved) -- a documented limitation, not
   silent data loss. */
function htmlToStyledRuns(html){
  const holder=document.createElement('div');
  holder.innerHTML=html||'';
  const runs=[];
  (function walk(node, bold, italic, underline){
    node.childNodes.forEach(child=>{
      if(child.nodeType===3){
        if(child.textContent) runs.push({text:child.textContent, bold, italic, underline});
      } else if(child.nodeType===1){
        const tag=child.tagName.toLowerCase();
        const nb=bold||tag==='b'||tag==='strong';
        const ni=italic||tag==='i'||tag==='em';
        const nu=underline||tag==='u';
        walk(child, nb, ni, nu);
      }
    });
  })(holder, false, false, false);
  return runs.length ? runs : [{text:holder.textContent||'', bold:false, italic:false, underline:false}];
}
function fdxStyleAttr(run){
  const parts=[];
  if(run.bold) parts.push('Bold');
  if(run.italic) parts.push('Italic');
  if(run.underline) parts.push('Underline');
  return parts.length ? ' Style="'+parts.join('+')+'"' : '';
}
function fdxParagraph(line){
  const runs=htmlToStyledRuns(line.html);
  const textXml=runs.map(r=>'<Text'+fdxStyleAttr(r)+'>'+fdxEscape(r.text)+'</Text>').join('');
  let type=FDX_TYPE_MAP[line.type];
  let alignAttr='';
  if(line.type==='centered'){ type='Action'; alignAttr=' Alignment="Center"'; }
  else if(line.type==='lyrics'){ type='Dialogue'; } // closest native equivalent; italic is preserved via the run styles above
  else if(!type){ type='Action'; } // fallback for any unexpected type
  if(line.align==='center') alignAttr=' Alignment="Center"';
  else if(line.align==='right') alignAttr=' Alignment="Right"';
  else if(line.align==='left') alignAttr=' Alignment="Left"';
  return '<Paragraph Type="'+type+'"'+alignAttr+'>'+textXml+'</Paragraph>';
}
function exportScriptFDX(){
  const lines=serializeLines();
  let titleLines=[], bodyLines=lines, sawForceBreak=false;
  for(let i=0;i<lines.length;i++){
    if(!sawForceBreak){
      titleLines.push(lines[i]);
      if(lines[i].forceBreakAfter){ sawForceBreak=true; bodyLines=lines.slice(i+1); }
    }
  }
  if(!sawForceBreak){ titleLines=[]; bodyLines=lines; } // no Title Page force-break found -- treat everything as body content
  const bodyXml=bodyLines.filter(l=>l.type!=='note').map(fdxParagraph).join('\n    ');
  const hasTitleContent=titleLines.some(l=>(l.text||'').trim().length);
  const titleXml=hasTitleContent
    ? '<TitlePage><Content>\n    '+titleLines.filter(l=>(l.text||'').trim().length).map(fdxParagraph).join('\n    ')+'\n  </Content></TitlePage>'
    : '';
  const xml='<?xml version="1.0" encoding="UTF-8" standalone="no" ?>\n'+
    '<FinalDraft DocumentType="Script" Template="No" Version="1">\n'+
    '  <Content>\n    '+bodyXml+'\n  </Content>\n'+
    (titleXml ? '  '+titleXml+'\n' : '')+
    '</FinalDraft>\n';
  const ok=downloadBlob('screenplay.fdx', xml, 'application/xml');
  showExportModal('Export Screenplay (.fdx — Final Draft)'+(ok?'':' — download blocked'), xml);
}

/* =========================================================
   EXPORT: PDF
   ---------------------------------------------------------
   Always uses standard paginated layout (the real, computed page breaks and
   dialogue (MORE)/(CONT'D) splits) regardless of whether Continuous Page
   View is currently on-screen -- a PDF is inherently a paged format.
   Re-derives its own line-wrapping and page breaks independently of the
   on-screen DOM/CSS engine (jsPDF has its own text-metrics and no access to
   the live layout), so it is a faithful *recreation* of standard screenplay
   formatting rather than a pixel-for-pixel screenshot of the editor.
   ========================================================= */
const PDF_IN={pageW:8.5, pageH:11, mTop:1, mBottom:1, mLeft:1.5, mRight:1};
const PDF_LINE_H=12/72; // 12pt Courier, 6 lines per inch -- standard screenplay convention
const PDF_COLS={ // {left, width} in inches, measured from the action-margin (mLeft)
  scene_heading:{left:0, width:6, upper:true},
  action:{left:0, width:6},
  character:{left:2.2, width:3.8, upper:true},
  dialogue:{left:1, width:3.5},
  parenthetical:{left:1.604, width:2, italic:true},
  transition:{left:0, width:6, upper:true, align:'right'},
  shot:{left:0, width:6, upper:true},
  centered:{left:0, width:6, align:'center'},
  lyrics:{left:1, width:3.5, italic:true},
  general:{left:0, width:6}
};
function pdfRunStyle(runs){
  // Whole-line style only: if every run shares the same bold/italic/underline
  // flags (the common case -- an entire extension in italics, an entire cue
  // in bold, or simply no formatting), use it as the PDF line's font style.
  // Genuinely mixed formatting *within* one line falls back to plain text
  // for that line rather than attempting a fully run-accurate wrapped
  // reflow -- a documented simplification, not silent corruption (the text
  // itself is always complete either way).
  if(!runs.length) return {bold:false, italic:false, underline:false};
  const first=runs[0];
  const uniform=runs.every(r=>r.bold===first.bold && r.italic===first.italic && r.underline===first.underline);
  return uniform ? first : {bold:false, italic:false, underline:false};
}
function pdfFontStyle(bold, italic){
  if(bold && italic) return 'bolditalic';
  if(bold) return 'bold';
  if(italic) return 'italic';
  return 'normal';
}
async function exportScriptPDF(){
  showToast('Building PDF…');
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  }catch(err){ showToast('Could not load the PDF library — check your connection'); return; }
  const jsPDFCtor=window.jspdf && window.jspdf.jsPDF;
  if(!jsPDFCtor){ showToast('PDF library failed to initialize'); return; }
  const doc=new jsPDFCtor({unit:'in', format:'letter'});
  doc.setFont('courier','normal'); doc.setFontSize(12);

  const lines=serializeLines();
  let titleLines=[], bodyLines=lines, sawForceBreak=false;
  for(let i=0;i<lines.length;i++){
    if(!sawForceBreak){
      titleLines.push(lines[i]);
      if(lines[i].forceBreakAfter){ sawForceBreak=true; bodyLines=lines.slice(i+1); }
    }
  }
  if(!sawForceBreak){ titleLines=[]; bodyLines=lines; }
  const hasTitleContent=titleLines.some(l=>(l.text||'').trim().length);

  let y=PDF_IN.mTop;
  let physicalPage=0; // 0-based: 0 = title page, 1 = first script page, 2 = second script page (first *numbered* page), ...
  const skipPages=hasTitleContent ? 2 : 1;
  function drawPageNumberIfNeeded(){
    if(physicalPage>=skipPages){
      const num=hasTitleContent ? physicalPage : physicalPage+1;
      doc.setFont('courier','normal');
      doc.text(num+'.', PDF_IN.pageW-PDF_IN.mRight, PDF_IN.mTop-0.3, {align:'right'});
    }
  }
  function newPage(){
    doc.addPage();
    physicalPage++;
    y=PDF_IN.mTop;
    drawPageNumberIfNeeded();
  }
  drawPageNumberIfNeeded(); // page 1 (title page, or page 1 of body if no title content)

  function printWrapped(text, col, style){
    const wrapped=doc.splitTextToSize(text, col.width);
    doc.setFont('courier', pdfFontStyle(style.bold, style.italic));
    wrapped.forEach(seg=>{
      if(y+PDF_LINE_H > PDF_IN.pageH-PDF_IN.mBottom){ newPage(); }
      const x=PDF_IN.mLeft+col.left;
      if(col.align==='right'){
        doc.text(seg, PDF_IN.mLeft+col.left+col.width, y, {align:'right'});
      } else if(col.align==='center'){
        doc.text(seg, PDF_IN.mLeft+col.left+col.width/2, y, {align:'center'});
      } else {
        doc.text(seg, x, y);
      }
      if(style.underline){
        const w=doc.getTextWidth(seg);
        const ux = col.align==='right' ? PDF_IN.mLeft+col.left+col.width-w
                 : col.align==='center' ? PDF_IN.mLeft+col.left+col.width/2-w/2
                 : x;
        doc.line(ux, y+0.02, ux+w, y+0.02);
      }
      y+=PDF_LINE_H;
    });
    return wrapped.length;
  }
  function printParagraph(line, colOverride){
    const col=colOverride||PDF_COLS[line.type]||PDF_COLS.action;
    const runs=htmlToStyledRuns(line.html);
    const style=pdfRunStyle(runs);
    if(col.italic) style.italic=true;
    let text=cleanBlockTextFromLine(line);
    if(col.upper) text=text.toUpperCase();
    if(!text.trim()) { y+=PDF_LINE_H; return; }
    printWrapped(text, col, style);
  }
  function cleanBlockTextFromLine(line){ return line.text||''; } // already cleaned by serializeLines()

  // --- Title Page ---
  if(hasTitleContent){
    titleLines.forEach(l=>printParagraph(l, PDF_COLS.centered));
    newPage();
  }

  // --- Body ---
  for(let i=0;i<bodyLines.length;i++){
    const line=bodyLines[i];
    if(line.type==='note') continue; // internal notes never print
    const text=(line.text||'');
    if(line.type==='dialogue'){
      const col=PDF_COLS.dialogue;
      const runs=htmlToStyledRuns(line.html);
      const style=pdfRunStyle(runs);
      const wrapped=doc.splitTextToSize(text, col.width);
      let idx=0;
      while(idx<wrapped.length){
        if(y+PDF_LINE_H > PDF_IN.pageH-PDF_IN.mBottom){
          // Doesn't fit -- split here: "(MORE)" centered under the dialogue
          // column, then continue on a fresh page under "CHARACTER (CONT'D)".
          doc.setFont('courier','normal');
          doc.text('(MORE)', PDF_IN.mLeft+col.left+col.width/2, y, {align:'center'});
          // find the preceding Character cue's name for the CONT'D label
          let charName='';
          for(let k=i-1;k>=0;k--){ if(bodyLines[k].type==='character'){ charName=(bodyLines[k].text||'').toUpperCase(); break; } }
          newPage();
          doc.setFont('courier','normal');
          doc.text(charName+' (CONT\'D)', PDF_IN.mLeft+PDF_COLS.character.left, y);
          y+=PDF_LINE_H;
          continue;
        }
        doc.setFont('courier', pdfFontStyle(style.bold, style.italic));
        doc.text(wrapped[idx], PDF_IN.mLeft+col.left, y);
        y+=PDF_LINE_H;
        idx++;
      }
      continue;
    }
    if(line.type==='character'){
      // Orphan control: keep a Character cue with at least the start of its
      // Dialogue -- if there isn't room for the cue plus one wrapped line of
      // the dialogue that follows, start a fresh page before the cue.
      const next=bodyLines[i+1];
      const needsRoom = next && next.type==='dialogue' ? PDF_LINE_H*2 : PDF_LINE_H;
      if(y+needsRoom > PDF_IN.pageH-PDF_IN.mBottom){ newPage(); }
      printParagraph(line);
      continue;
    }
    if(y+PDF_LINE_H > PDF_IN.pageH-PDF_IN.mBottom){ newPage(); }
    printParagraph(line);
  }

  doc.save('screenplay.pdf');
  showToast('PDF downloaded');
}
function parseTextToLines(text){
  const paras=text.split(/\n\s*\n/).filter(p=>p.trim());
  return paras.map(raw=>{
    const firstLine=raw.split('\n')[0];
    const leadingWs=(firstLine.match(/^[ \t]*/)||[''])[0];
    const indentCols=leadingWs.replace(/\t/g,'    ').length;
    const clean=raw.replace(/\n/g,' ').trim();
    let type='action';
    if(/^(INT|EXT|INT\.\/EXT|I\/E)[. ]/i.test(clean)) type='scene_heading';
    else if(/^[A-Z0-9 .'\-]{2,30}$/.test(clean) && clean===clean.toUpperCase() && clean.split(' ').length<=5) type='character';
    else if(/^\(.*\)$/.test(clean)) type='parenthetical';
    else if(/(TO:|FADE (IN|OUT))\s*$/i.test(clean) && clean===clean.toUpperCase()) type='transition';
    else if(indentCols>=6) type='dialogue';
    return {type, text:clean};
  });
}

const loadedScripts={};
function loadScript(url){
  if(loadedScripts[url]) return loadedScripts[url];
  loadedScripts[url]=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=url; s.onload=()=>resolve(true); s.onerror=()=>reject(new Error('Failed to load '+url));
    document.head.appendChild(s);
  });
  return loadedScripts[url];
}
async function docxFileToLines(file){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js');
  const buf=await file.arrayBuffer();
  const result=await window.mammoth.extractRawText({arrayBuffer:buf});
  return parseTextToLines(result.value||'');
}
async function pdfFileToLines(file){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const doc=await window.pdfjsLib.getDocument({data:buf}).promise;
  const lines=[];
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);
    const content=await page.getTextContent();
    const rows=[]; // group text items into visual lines by y position
    content.items.forEach(item=>{
      const y=Math.round(item.transform[5]);
      const x=item.transform[4];
      let row=rows.find(r=>Math.abs(r.y-y)<3);
      if(!row){ row={y, minX:x, text:''}; rows.push(row); }
      row.minX=Math.min(row.minX,x);
      row.text+=item.str;
    });
    rows.sort((a,b)=>b.y-a.y);
    const pageWidth=page.view[2]-page.view[0];
    rows.forEach(row=>{
      const clean=row.text.trim();
      if(!clean) return;
      const indentRatio=(row.minX-page.view[0])/pageWidth;
      let type='action';
      if(/^(INT|EXT|INT\.\/EXT|I\/E)[. ]/i.test(clean)) type='scene_heading';
      else if(/^\(.*\)$/.test(clean)) type='parenthetical';
      else if(/^(CUT TO:|FADE (IN|OUT):?|DISSOLVE TO:)$/i.test(clean)) type='transition';
      else if(clean===clean.toUpperCase() && indentRatio>0.32 && clean.split(' ').length<=6) type='character';
      else if(indentRatio>0.22 && indentRatio<0.5) type='dialogue';
      lines.push({type, text:clean});
    });
  }
  return lines;
}

async function importFile(file){
  const lower=file.name.toLowerCase();
  if(lower.endsWith('.json')){
    try{
      const text=await file.text();
      const data=JSON.parse(text);
      undoStack.push(snapshotState());
      initScreenplay(data.lines||[]);
      notesLayer.innerHTML=''; Object.keys(noteEls).forEach(k=>delete noteEls[k]);
      state.notes=migrateNotes(data.notes); state.shots=data.shots||[]; state.milestones=data.milestones||[]; state.drawings=migrateDrawings(data.drawings||[]); state.images=data.images||[];
      if(data.projectTitle){ state.projectTitle=data.projectTitle; document.getElementById('projectTitle').textContent=state.projectTitle; }
      state.notes.forEach(n=>createNoteDOM(n));
      refreshAllShotOptions();
      recomputePagination(); layoutAllNotes(); renderDrawLayer(); renderImagesLayer();
      renderSidebar('left'); renderSidebar('right'); renderTimeline();
      scheduleAutosave(); showToast('Project imported');
    }catch(err){ showToast('Could not read that project file'); }
    return;
  }
  if(lower.endsWith('.docx') || lower.endsWith('.pdf')){
    showToast(lower.endsWith('.docx') ? 'Reading Word document…' : 'Reading PDF…');
    try{
      const lines = lower.endsWith('.docx') ? await docxFileToLines(file) : await pdfFileToLines(file);
      if(!lines.length){ showToast('No readable text found in that file'); return; }
      undoStack.push(snapshotState());
      initScreenplay(lines);
      recomputePagination(); layoutAllNotes();
      scheduleAutosave(); showToast('Imported and formatted '+lines.length+' lines');
    }catch(err){ showToast('Could not import that file — '+(err.message||'unknown error')); }
    return;
  }
  const text=await file.text();
  undoStack.push(snapshotState());
  initScreenplay(parseTextToLines(text));
  recomputePagination(); layoutAllNotes();
  scheduleAutosave(); showToast('Text imported and formatted');
}

/* =========================================================
   STORAGE ENGINE (IndexedDB, with a localStorage fallback)
   ---------------------------------------------------------
   Previously every persistence call in this app went through
   `window.storage`, an API injected only by the Claude Artifacts iframe
   host. It does not exist when this file is opened as a plain website,
   installed as a PWA, or wrapped in Capacitor for iPad/Android — so
   project save/load silently did nothing (or, for the projects index,
   threw) in every one of those environments. `dbStorage` below is a
   drop-in replacement with the same get/set/delete shape, backed by a
   standard IndexedDB database that works identically everywhere this file
   runs. If IndexedDB itself is unavailable (very old WebViews, some
   locked-down browser privacy modes), it falls back to `localStorage`
   automatically and transparently — callers never need to know which
   backend actually served the call.
   ========================================================= */
const NDB_NAME='novel-dots-db';
const NDB_VERSION=1;
const NDB_STORE='kv';

let _ndbConnPromise=null;
function openNovelDotsDB(){
  if(_ndbConnPromise) return _ndbConnPromise;
  _ndbConnPromise=new Promise((resolve,reject)=>{
    try{
      if(typeof indexedDB==='undefined'){ reject(new Error('indexeddb-unavailable')); return; }
      const req=indexedDB.open(NDB_NAME, NDB_VERSION);
      req.onupgradeneeded=function(e){
        const db=e.target.result;
        if(!db.objectStoreNames.contains(NDB_STORE)) db.createObjectStore(NDB_STORE);
      };
      req.onsuccess=function(e){ resolve(e.target.result); };
      req.onerror=function(e){ reject((e.target && e.target.error) || new Error('indexeddb-open-failed')); };
      req.onblocked=function(){ reject(new Error('indexeddb-blocked')); };
    }catch(err){ reject(err); }
  });
  return _ndbConnPromise;
}

// True IndexedDB-backed implementation.
const idbBackend={
  get(key){
    return openNovelDotsDB().then(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(NDB_STORE,'readonly');
      const req=tx.objectStore(NDB_STORE).get(key);
      req.onsuccess=()=>resolve(req.result===undefined ? null : {key, value:req.result});
      req.onerror=()=>reject(req.error);
    }));
  },
  set(key, value){
    return openNovelDotsDB().then(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(NDB_STORE,'readwrite');
      tx.objectStore(NDB_STORE).put(value, key);
      tx.oncomplete=()=>resolve({key, value});
      tx.onerror=()=>reject(tx.error);
    }));
  },
  delete(key){
    return openNovelDotsDB().then(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(NDB_STORE,'readwrite');
      tx.objectStore(NDB_STORE).delete(key);
      tx.oncomplete=()=>resolve({key, deleted:true});
      tx.onerror=()=>reject(tx.error);
    }));
  },
  list(prefix){
    return openNovelDotsDB().then(db=>new Promise((resolve,reject)=>{
      const tx=db.transaction(NDB_STORE,'readonly');
      const keys=[];
      const req=tx.objectStore(NDB_STORE).openCursor();
      req.onsuccess=function(e){
        const cursor=e.target.result;
        if(cursor){
          if(!prefix || String(cursor.key).indexOf(prefix)===0) keys.push(cursor.key);
          cursor.continue();
        } else resolve({keys});
      };
      req.onerror=()=>reject(req.error);
    }));
  }
};

// Fallback used only if IndexedDB itself failed to open at all.
const NDB_LS_PREFIX='novel-dots-kv:';
const lsBackend={
  async get(key){
    try{
      const raw=localStorage.getItem(NDB_LS_PREFIX+key);
      return raw===null ? null : {key, value:JSON.parse(raw)};
    }catch(err){ return null; }
  },
  async set(key, value){
    localStorage.setItem(NDB_LS_PREFIX+key, JSON.stringify(value));
    return {key, value};
  },
  async delete(key){
    localStorage.removeItem(NDB_LS_PREFIX+key);
    return {key, deleted:true};
  },
  async list(prefix){
    const keys=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.indexOf(NDB_LS_PREFIX)===0){
        const realKey=k.slice(NDB_LS_PREFIX.length);
        if(!prefix || realKey.indexOf(prefix)===0) keys.push(realKey);
      }
    }
    return {keys};
  }
};

// Resolved once per session: try IndexedDB first, fall back to localStorage
// permanently for this session if opening the database ever fails.
let _ndbBackendPromise=null;
function ndbBackend(){
  if(!_ndbBackendPromise){
    _ndbBackendPromise=openNovelDotsDB().then(()=>idbBackend).catch(()=>lsBackend);
  }
  return _ndbBackendPromise;
}

/* Drop-in replacement for the old `window.storage` calls used throughout
   this file. Same get/set/delete/list shape; the 3rd "shared" argument the
   Claude Artifacts API took no longer applies (this is a purely local,
   single-user database) and has been dropped from every call site. */
const dbStorage={
  async get(key){ const b=await ndbBackend(); return b.get(key); },
  async set(key, value){ const b=await ndbBackend(); return b.set(key, value); },
  async delete(key){ const b=await ndbBackend(); return b.delete(key); },
  async list(prefix){ const b=await ndbBackend(); return b.list(prefix); }
};

/* =========================================================
   PROJECTS / PERSISTENCE (IndexedDB via dbStorage)
   ---------------------------------------------------------
   Every navigation (Home, opening a project, autosave) used to do at least
   one full read-modify-write round trip against storage just to keep
   the "My Projects" index up to date, and several call sites (goHome,
   createBlankProject, the debounced autosave) awaited that round trip
   *before* the UI could move on — so switching screens always waited on
   storage even though nothing on screen actually needed the response.
   The index is now kept as an in-memory cache (`projectsIndexCache`),
   loaded once per session; every mutation updates the cache synchronously
   (so the UI can re-render instantly from it) and persists to storage in
   the background via `persistProjectsIndex()`, never blocking navigation.
   ========================================================= */
function newProjectId(){ return 'proj_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }

let projectsIndexCache; // undefined = not yet loaded this session (distinct from [] = loaded and empty)
function persistProjectsIndex(){
  if(!projectsIndexCache) return;
  // Fire-and-forget: the in-memory cache is already the source of truth for
  // rendering, so nothing needs to wait on this write actually completing.
  dbStorage.set('novel-dots-projects-index', JSON.stringify(projectsIndexCache)).catch(()=>{});
}
async function ensureProjectsIndexLoaded(){
  if(projectsIndexCache!==undefined) return projectsIndexCache;
  let idx=null;
  try{
    const r=await dbStorage.get('novel-dots-projects-index');
    idx=(r && r.value) ? JSON.parse(r.value) : null;
  }catch(err){ idx=null; }
  if(idx===null){
    // Genuinely first-ever visit (the index key itself has never existed) —
    // seed one example project so the app isn't empty. Only ever happens once:
    // every later load finds the (now-persisted) index key and gets `[]`
    // instead of `null`, even if the user has since deleted every project.
    idx=[];
    const exampleId=newProjectId();
    const exampleData={format:'novel-dots-project', version:1, projectTitle:'Salt and Signal (example)',
      lines:titlePageLines('Salt and Signal','A. Rivera').concat(SAMPLE_LINES), notes:[], shots:[], milestones:[], drawings:[]};
    await saveProjectData(exampleId, exampleData);
    idx.push({id:exampleId, title:exampleData.projectTitle, createdAt:Date.now(), updatedAt:Date.now()});
    projectsIndexCache=idx;
    persistProjectsIndex();
    return projectsIndexCache;
  }
  projectsIndexCache=idx;
  return projectsIndexCache;
}
async function loadProjectData(id){
  try{
    const r=await dbStorage.get('novel-dots-project-'+id);
    if(r && r.value) return JSON.parse(r.value);
  }catch(err){}
  return null;
}
async function saveProjectData(id, data){
  try{ await dbStorage.set('novel-dots-project-'+id, JSON.stringify(data)); }catch(err){}
}
async function deleteProjectData(id){
  try{ await dbStorage.delete('novel-dots-project-'+id); }catch(err){}
}
/* Synchronous: updates the in-memory index immediately (so any render right
   after this call already reflects it) and kicks off a background persist. */
function touchProjectIndexSync(id, title){
  if(!projectsIndexCache) projectsIndexCache=[];
  const existing=projectsIndexCache.find(p=>p.id===id);
  if(existing){ existing.title=title; existing.updatedAt=Date.now(); }
  else { projectsIndexCache.push({id, title, createdAt:Date.now(), updatedAt:Date.now()}); }
  persistProjectsIndex();
}

const scheduleAutosave=debounce(async function(){
  if(!state.projectId) return;
  touchProjectIndexSync(state.projectId, state.projectTitle);
  try{
    await saveProjectData(state.projectId, projectData());
  }catch(err){ /* storage unavailable — work continues in-memory only */ }
}, 900);

async function enterEditor(id, data){
  state.projectId=id;
  state.projectTitle=data.projectTitle || 'Untitled Screenplay';
  document.getElementById('projectTitle').textContent=state.projectTitle;

  notesLayer.innerHTML=''; Object.keys(noteEls).forEach(k=>delete noteEls[k]);
  state.notes=migrateNotes(data.notes); state.shots=data.shots||[]; state.milestones=data.milestones||[]; state.drawings=migrateDrawings(data.drawings||[]); state.images=data.images||[];
  state.activeShotId=null;
  content.classList.remove('shot-focus');
  highlightedLineId=null;

  // always start a freshly-opened project in normal paginated view.

  if(cvBtn){ cvBtn.classList.remove('active'); cvBtn.title='Continuous Page View'; }
  Object.keys(state.filters).forEach(k=>state.filters[k].clear());
  state.notes.forEach(n=>createNoteDOM(n));
  refreshAllShotOptions();
  showEditorView();
  fitInitialView();
  recomputePagination();
  layoutAllNotes();
  renderDrawLayer();
  renderImagesLayer();
  renderSidebar('left'); renderSidebar('right'); renderTimeline();
  undoStack=[snapshotState()]; redoStack=[];
  updateUndoButtons();
}
async function createBlankProject(){
  const id=newProjectId();
  const data={format:'novel-dots-project', version:1, projectTitle:'Untitled Screenplay',
    lines:titlePageLines('','').concat([{type:'scene_heading', text:''}]),
    notes:[], shots:[], milestones:[], drawings:[], images:[]};
  // Enter the editor immediately with the data we already have in memory —

async function openProject(id){

}
/* Explicit, user-triggered save (File > Save, Ctrl/Cmd+S) -- unlike
   scheduleAutosave (debounced 900ms, silent, fire-and-forget), this saves
   immediately and reports success/failure so a deliberate "Save" click
   always means the data is actually on its way to storage right now, not
   just queued. */
async function manualSave(){
  if(!state.projectId) return;
  touchProjectIndexSync(state.projectId, state.projectTitle);
  try{
    await saveProjectData(state.projectId, projectData());
    showToast('Saved');
  }catch(err){
    showToast('Save failed — working copy only');
  }

/* File > Save As -- prompts for a new title, writes the current in-memory
   project out under a brand-new project id/title (added to My Projects),
   and switches the live session onto that new id, the same way a desktop
   word processor's Save As makes the copy the file you keep working in.
   The original project is left exactly as it was last saved. */
async function saveAsProject(){
  if(!state.projectId) return;
  const suggested=(state.projectTitle||'Untitled Screenplay')+' Copy';
  const title=await promptModal('Save As', 'Project title', suggested);
  if(title===null) return;
  const newId=newProjectId();
  const data=Object.assign({}, projectData(), {projectTitle:title});
  touchProjectIndexSync(newId, title);
  try{
    await saveProjectData(newId, data);
  }catch(err){ /* still switch over -- it's in memory and will retry via autosave */ }
  state.projectId=newId;
  state.projectTitle=title;
  document.getElementById('projectTitle').textContent=title;
  if(state.activeTab.left==='scenes') renderSidebar('left');
  showToast('Saved as "'+title+'"');
}
async function goHome(){
  closeFindPopover(); closeReplacePopover(); clearFindState();
  if(state.projectId){
    // Navigate home immediately; save in the background. The in-memory index
    // update happens synchronously so the landing page's list is already
    // correct the instant it renders, without waiting on storage at all.
    touchProjectIndexSync(state.projectId, state.projectTitle);
    saveProjectData(state.projectId, projectData()).catch(()=>{});
  }
  state.projectId=null;
  showLandingView();
  renderProjectsList();
}

async function renderProjectsList(){
  const listEl=document.getElementById('projectsList');
  if(projectsIndexCache===undefined) listEl.innerHTML='<div class="landing-empty">Loading…</div>';
  let idx=await ensureProjectsIndexLoaded();
  idx=idx.slice().sort((a,b)=>(b.createdAt||b.updatedAt||0)-(a.createdAt||a.updatedAt||0));
  listEl.innerHTML='';
  if(!idx.length){ listEl.innerHTML='<div class="landing-empty">No saved projects yet — start with Blank Script above.</div>'; return; }
  idx.forEach(p=>{
    const row=document.createElement('div'); row.className='project-row';
    const titleSpan=document.createElement('span'); titleSpan.className='pr-title'; titleSpan.textContent=p.title||'Untitled Screenplay';
    const dateSpan=document.createElement('span'); dateSpan.className='pr-date'; dateSpan.textContent=new Date(p.updatedAt).toLocaleDateString();
    const iconSpan=document.createElement('span'); iconSpan.className='pr-icon';
    const delBtn=document.createElement('button'); delBtn.className='pr-delete'; delBtn.title='Delete project';
    delBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg>';
    delBtn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const ok=await confirmModal('Delete project', 'Delete "'+(p.title||'Untitled Screenplay')+'"? This cannot be undone.');
      if(!ok) return;
      // Update the visible list and in-memory index immediately; the actual
      // storage delete/persist happens in the background.
      if(projectsIndexCache) projectsIndexCache=projectsIndexCache.filter(x=>x.id!==p.id);
      persistProjectsIndex();
      deleteProjectData(p.id).catch(()=>{});
      renderProjectsList();
    });
    row.appendChild(iconSpan); row.appendChild(titleSpan); row.appendChild(dateSpan); row.appendChild(delBtn);
    row.addEventListener('click', ()=>openProject(p.id));
    listEl.appendChild(row);
  });
}

/* Bold/Italic/Underline/Strikethrough are character-level now (real inline elements via
   execCommand), so their "active" state reflects the live selection/caret — not any one
   block's data — via queryCommandState. Works the same whether focus is in the script or
   inside a note's text body (both are contenteditable). */
function refreshFormatButtonStates(){
  let boldOn=false, italicOn=false, underlineOn=false, strikeOn=false;
  try{
    boldOn=document.queryCommandState('bold');
    italicOn=document.queryCommandState('italic');
    underlineOn=document.queryCommandState('underline');
    strikeOn=document.queryCommandState('strikeThrough');
  }catch(e){ /* no active editable selection — leave all off */ }
  document.getElementById('btnBold').classList.toggle('align-active', boldOn);
  document.getElementById('btnItalic').classList.toggle('align-active', italicOn);
  document.getElementById('btnUnderline').classList.toggle('align-active', underlineOn);
  document.getElementById('btnStrike').classList.toggle('align-active', strikeOn);
}
document.addEventListener('selectionchange', function(){
  const sel=window.getSelection();
  refreshFormatButtonStates();
  // A contenteditable region only fires focus/blur once for the whole editing
  // host, never per-paragraph — so "focused a Title Page field" / "left it"
  // has to be tracked via cursor movement (selectionchange) instead. Restore
  // a title/author placeholder the instant the cursor leaves that field
  // (still empty), and hide it the instant the cursor arrives — before any
  // typing happens, not just once input starts.
  if(lastActiveBlock && lastActiveBlock.dataset && lastActiveBlock.dataset.titleRole){
    const stillThere = sel && sel.anchorNode && (lastActiveBlock===sel.anchorNode || lastActiveBlock.contains(sel.anchorNode));
    if(!stillThere) updateTitlePagePlaceholders();
  }
  if(!sel || !sel.anchorNode) return;
  if(content.contains(sel.anchorNode)){
    updateSelectionCursorState();
    const b=getCurrentBlock(sel);
    if(b && b.dataset.titleRole) b.classList.remove('ph-empty');
    // The dialogue gap-spacer (see PAGINATION) is intentionally left alone
    // here now -- unlike the old combined break element, it holds no visible
    // "(MORE)"/"CONT'D" text of its own (that's a separate overlay layer),
    // so there's nothing for ordinary cursor movement or typing to corrupt,
    // and "(MORE)" stays visible and in place the whole time the user is
    // editing or clicking around in the block, per the hard rule that its
    // position/visibility must never depend on cursor presence.
    // Placing the cursor directly in the script is "normal paragraph
    // selection" — tight text-hugging highlight on that paragraph (see
    // renderTextHighlights), and clears any note-triggered highlight left
    // over from before.
    if(b){ lastActiveBlock=b; refreshToolbarForBlock(b); setHighlightedLine(b.dataset.id); }
    clearNoteHighlight();
    return;
  }
  content.classList.remove('has-active-selection'); // selection moved outside the script entirely
  const noteBody=sel.anchorNode.nodeType===1 ? sel.anchorNode.closest('.note-body') : (sel.anchorNode.parentElement && sel.anchorNode.parentElement.closest('.note-body'));
  if(noteBody){
    const wrap=noteBody.closest('.note-wrap');
    if(wrap){
      const note=state.notes.find(n=>n.id===wrap.dataset.noteId);
      if(note){ setNoteHighlight(note.anchorLineIds); }
    }
  }
});

document.addEventListener('keydown', function(e){
  const mod=e.ctrlKey||e.metaKey;
  if(mod && e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
  else if(mod && ((e.key.toLowerCase()==='z' && e.shiftKey) || e.key.toLowerCase()==='y')){ e.preventDefault(); redo(); }
  else if(mod && e.key.toLowerCase()==='f'){ e.preventDefault(); openFindPopover(); }
  // Ctrl/Cmd+H opens Replace. On macOS specifically, Cmd+H is the OS-level
  // "Hide Application" shortcut and gets consumed by the system before a web
  // page's keydown handler ever sees it (the same class of conflict this
  // codebase already avoided Cmd+M for — see the sticky-note shortcut).
  // Ctrl+H (Windows/Linux) isn't affected and works as-is; Cmd+Shift+H is
  // matched by the same condition below as a reliable Mac equivalent.
  else if(mod && e.key.toLowerCase()==='h'){ e.preventDefault(); openReplacePopover(); }
  else if(mod && e.key.toLowerCase()==='s'){ e.preventDefault(); manualSave(); }
  else if(mod && e.key==='['){ e.preventDefault(); setPanel('left', !state.panelsVisible.left); }
  else if(mod && e.key===']'){ e.preventDefault(); setPanel('right', !state.panelsVisible.right); }
  else if(mod && e.key==='.'){ e.preventDefault(); addMilestone(); }
  // Ctrl/Cmd+J toggles Note Selection. Note: in Chrome (and some other
  // browsers) this combination is also the reserved shortcut for the
  // Downloads panel, which a page's own preventDefault() can't override --
  // the same class of unavoidable OS/browser-level collision already noted
  // above for Cmd+H (Hide Application) and Cmd+M (Minimize).
  else if(mod && e.key.toLowerCase()==='j'){ e.preventDefault(); setNoteSelectMode(!noteSelectMode); }
  else if(e.key==='Enter' && noteSelectMode){
    const ae=document.activeElement;
    const editing = ae && (ae.isContentEditable || ae.tagName==='INPUT' || ae.tagName==='TEXTAREA');
    const modalOpen = modalRoot && !modalRoot.classList.contains('hidden');
    if(!editing && !modalOpen){ e.preventDefault(); setNoteSelectMode(false); }
  }
  else if((e.key==='Delete'||e.key==='Backspace') && currentTool==='select' && selectedDrawingId){
    const ae=document.activeElement;
    const editing = ae && (ae.isContentEditable || ae.tagName==='INPUT' || ae.tagName==='TEXTAREA');
    if(!editing){ e.preventDefault(); deleteDrawing(selectedDrawingId); }
  }
  else if(e.key==='Escape'){
    hideContextMenu(); if(!modalRoot.classList.contains('hidden')) closeModal();
    if(document.getElementById('findPopover')){ closeFindPopover(); clearFindState(); }
    if(document.getElementById('replacePopover')){ closeReplacePopover(); clearFindState(); }
    clearShotFocus(); if(currentTool!=='none') setTool('none'); if(connectPending) endConnectMode();
    if(noteSelectMode) setNoteSelectMode(false);
  }
});
function showScriptContextMenu(clientX, clientY){
  if(readOnlyMode) return; // nothing but mutating actions live in this menu -- see createMenuItemsAt for the empty-canvas equivalent
  const w=screenToWorld(clientX, clientY);
  const targetEl=document.elementFromPoint(clientX, clientY);
  const targetBlock=targetEl ? targetEl.closest('.line-block') : null;
  const explicitLineId=targetBlock ? targetBlock.dataset.id : null;
  const sel=window.getSelection();
  const hasSelection = sel && !sel.isCollapsed && content.contains(sel.anchorNode);
  const selectedLineIds = hasSelection ? linesTouchedBySelection().map(b=>b.dataset.id) : [];
  const connectLineIds = selectedLineIds.length ? selectedLineIds : (explicitLineId ? [explicitLineId] : []);
  const items=[
    {label:'Add Dot Note here', icon:'dot', onClick:()=>createNote('dot', w.x, w.y, explicitLineId, selectedLineIds)},
    {label:'Add Sticky Note here', icon:'dot-outline', onClick:()=>createNote('sticky', w.x, w.y)}
  ];
  if(connectLineIds.length){
    items.push({sep:true});
    items.push({label:'Connect with a Note', onClick:()=>startConnectFromParagraph(connectLineIds)});
  }
  if(hasSelection){ items.push({label:'New Shot from selection', onClick:createShotFromSelection}); }
  showContextMenu(clientX, clientY, items);
}
content.addEventListener('contextmenu', function(e){
  if(currentTool!=='none'){ e.preventDefault(); e.stopPropagation(); return; }
  e.preventDefault();
  e.stopPropagation();
  showScriptContextMenu(e.clientX, e.clientY);
});
let contentLongPressTimer=null;
/* Tracks whether the mouse button is currently held down inside the script,
   so the arrow-cursor-after-selecting behavior (see .has-active-selection)
   only kicks in once a drag-selection has actually finished -- during the
   drag itself the cursor must stay an I-beam per the existing hard rule. */
let isPointerDownInContent=false;
function updateSelectionCursorState(){
  const sel=window.getSelection();
  const has = sel && !sel.isCollapsed && sel.anchorNode && content.contains(sel.anchorNode) && !isPointerDownInContent;
  content.classList.toggle('has-active-selection', !!has);
}
content.addEventListener('pointerdown', function(e){
  if(currentTool!=='none' || e.button!==0) return;
  isPointerDownInContent=true;
  updateSelectionCursorState(); // a fresh click always starts collapsed -- clear any stale arrow-cursor state immediately
  const cx=e.clientX, cy=e.clientY;
  contentLongPressTimer=setTimeout(()=>{
    contentLongPressTimer=null;
    showScriptContextMenu(cx, cy);
  }, 550);
});
/* Dragging a selection down until the pointer lands in the visual "gap"
   between two paragraphs -- that space is CSS padding-top belonging to the
   FOLLOWING paragraph (part of its own box, even though visually it sits
   above that paragraph's actual text) -- resolves the browser's native
   selection endpoint to offset 0 of that following paragraph: technically
   zero characters of it are selected, but the native blue selection
   highlight still visibly extends across that paragraph's own leading gap
   (and its getClientRects() can bleed a sliver into its first row too),
   making it look like "the next line got selected too" even though
   nothing was actually included from it -- copy/paste already worked fine
   since the actual character range was always correct; this only affects
   what's visibly painted.
   Corrected here once the drag settles (checked on pointerup, not during
   selectionchange -- adjusting the selection mid-drag would fight the
   browser's own live tracking and make dragging feel broken): if the
   selection's end sits at the very start (offset 0) of a different
   line-block than where the selection began, snap the end back to the true
   end of the preceding block instead -- exactly where the user's drag
   visually stopped. A genuinely intentional selection into the next
   paragraph's actual text always has endOffset>=1 there once any of its
   text is included, so this can never misfire on a real multi-paragraph
   selection -- and using the Range's own start/end (always in document
   order, regardless of whether the drag went forward or backward) means it
   corrects the overrun symmetrically in both drag directions. */
function lastTextNodeIn(el){
  if(el.nodeType===3) return el.length ? el : null;
  for(let i=el.childNodes.length-1;i>=0;i--){ const t=lastTextNodeIn(el.childNodes[i]); if(t) return t; }
  return null;
}
function correctDragSelectionOverrun(){
  const sel=window.getSelection();
  if(!sel || sel.rangeCount!==1 || sel.isCollapsed) return;
  const range=sel.getRangeAt(0);
  function blockOf(n){ while(n && !(n.classList && n.classList.contains('line-block'))) n=n.parentElement; return n; }
  const startBlock=blockOf(range.startContainer), endBlock=blockOf(range.endContainer);
  if(!startBlock || !endBlock || startBlock===endBlock) return;
  if(!content.contains(startBlock) || !content.contains(endBlock)) return;
  const atVeryStartOfEndBlock = range.endOffset===0 &&
    (range.endContainer===endBlock || range.endContainer===endBlock.firstChild ||
     (range.endContainer.nodeType===3 && !range.endContainer.previousSibling && range.endContainer.parentElement===endBlock));
  if(!atVeryStartOfEndBlock) return;
  const prev=endBlock.previousElementSibling;
  if(!prev || !prev.classList.contains('line-block')) return;
  const newRange=document.createRange();
  newRange.setStart(range.startContainer, range.startOffset);
  const lastText=lastTextNodeIn(prev);
  if(lastText) newRange.setEnd(lastText, lastText.length);
  else newRange.setEnd(prev, 0);
  sel.removeAllRanges();
  sel.addRange(newRange);
}
function cancelContentLongPress(){ if(contentLongPressTimer){ clearTimeout(contentLongPressTimer); contentLongPressTimer=null; } }
content.addEventListener('pointermove', cancelContentLongPress);
content.addEventListener('pointerup', function(){ cancelContentLongPress(); isPointerDownInContent=false; updateSelectionCursorState(); correctDragSelectionOverrun(); renderTextSelectionHighlight(); });
content.addEventListener('pointerleave', function(){ cancelContentLongPress(); isPointerDownInContent=false; updateSelectionCursorState(); });

/* =========================================================
   INIT
   ========================================================= */
async function init(){
  document.getElementById('app').classList.add('hidden');
  // Theme and the projects index are independent reads — fetch them in
  // parallel rather than one-after-another so the landing page appears
  // after a single round trip's worth of latency, not two.
  await Promise.all([loadThemePref(), renderProjectsList()]);
  window.addEventListener('resize', debounce(()=>{ if(state.projectId){ recomputePagination(); layoutAllNotes(); } }, 200));
}
init();

})();
</script>
