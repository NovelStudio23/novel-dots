          used=CONTD_LABEL_H+split.afterHeight; // the continuation already occupies this much of the fresh page
          continue;
        }
      }
      let breakIdx=i;
      if(blocks[i-1] && blocks[i-1].dataset.type==='character' && breakIdx-1>pageStart){ breakIdx=i-1; }
      let removedSum=heights[i];
      if(breakIdx===i-1) removedSum+=heights[i-1];
      const usedAtBreak=used-removedSum;
      const remainder=Math.max(0,BUDGET-usedAtBreak);
      breaks.push({beforeEl:blocks[breakIdx], remainder});
      pageStart=breakIdx;
      used=0;
      i=breakIdx-1;
    } else if(forcedBreak){
      const remainder=Math.max(0,BUDGET-used);
      breaks.push({beforeEl:blocks[i+1], remainder});
      pageStart=i+1;
      used=0;
    }

  const hasTitlePage=!!content.querySelector('.line-block[data-force-break="1"]');
  totalPageCount=breaks.length+dialogueSplits.length+1;
  if(sig===_lastPaginationSig && !_forcePaginationRebuild){ updatePageIndicator(); return; } // pagination unchanged — skip all DOM mutation to keep the caret stable
  _lastPaginationSig=sig;
  _forcePaginationRebuild=false;
  content.querySelectorAll('.page-spacer').forEach(n=>n.remove());
  content.querySelectorAll('.dlg-gap-spacer').forEach(n=>n.remove());
  dialogueSplits.forEach(d=>{ buildDialogueGapSpacer(d.block, d.offset, d.spaceLeft, d.beforeHeight); });
  breaks.forEach(b=>{
    const spacer=document.createElement('div');
    spacer.className='page-spacer';
    spacer.contentEditable='false';
    spacer.style.height=(b.remainder+M_BOTTOM+GAP+M_TOP)+'px';
    b.beforeEl.before(spacer);
  });

  renderPageDecor(totalPageCount, hasTitlePage?2:1);
  updatePageIndicator();
}
function renderPageDecor(pageCount, skipPages){
  skipPages = skipPages||1;
  pageDecor.innerHTML='';
  for(let i=0;i<pageCount;i++){
    const top=i*(PAGE_H+GAP);
    const sheet=document.createElement('div');
    sheet.className='page-sheet';
    sheet.style.top=top+'px';
    pageDecor.appendChild(sheet);
    if(i>=skipPages){
      const num=document.createElement('div');
      num.className='page-number';
      num.style.top=(top+48)+'px';
      num.textContent=(i-skipPages+2)+'.';
      pageDecor.appendChild(num);
    }
  }
}
/* Continuous Page View's own pagination pass. Structurally mirrors
   recomputePagination()'s main forward walk (same BUDGET-based overflow
   check, same "keep a Character cue with its Dialogue" orphan-control
   rewind) so page-NUMBER boundaries land on exactly the positions normal
   pagination would choose -- with two deliberate differences: Dialogue
   blocks are never split here (no (MORE)/(CONT'D) in this mode), a
   dialogue block that would have needed a mid-block split instead moves as
   a whole unit to the next notional page, same as the classic "no split
   viable" fallback already used elsewhere; and the Title Page is excluded
   from the continuous flow entirely (see below) -- everywhere else, no
   page-spacers or dialogue-split elements are ever inserted, the
   boundaries found here only drive where page-number labels are drawn (see
   renderPageDecorContinuous); the actual DOM layout is left to flow
   completely naturally. */
function recomputePaginationContinuous(blocks){
  if(!blocks.length){
    content.querySelectorAll('.page-spacer').forEach(n=>n.remove());
    content.querySelectorAll('.dlg-gap-spacer').forEach(n=>n.remove());
    if(dialogueLabelsLayer) dialogueLabelsLayer.innerHTML='';
    _lastPaginationSig=null; _lastContinuousSig=null; _forcePaginationRebuild=false;
    continuousPageBoundaries=[];
    renderPageDecorContinuous([], false, 0);
    totalPageCount=1; updatePageIndicator();
    return;
  }
  // The Title Page stays its own separate, fixed-size single page even in
  // Continuous View -- per an explicit request, matching how a standard
  // word processor's continuous scroll still keeps a title/cover page
  // distinct rather than flowing it together with the body. A .page-spacer
  // is inserted right after its forceBreakAfter line (identical in spirit
  // to how normal paginated mode force-breaks it onto its own page: filled
  // to the remainder of a full page's budget regardless of how little
  // actual content the title page has), and only the BODY blocks
  // (everything after that spacer) are measured/flowed by the
  // notional-page-boundary walk below -- the title page's own content is
  // left completely alone, never touched by this function beyond that one
  // spacer.
  const titleBreakIdx=blocks.findIndex(el=>el.dataset.forceBreak==='1');
  const hasTitlePage = titleBreakIdx>=0 && titleBreakIdx+1<blocks.length;
  let bodyBlocks=blocks, bodyStartY=0, titleRemainder=0;
  if(hasTitlePage){
    const titleHeights=blocks.slice(0,titleBreakIdx+1).map(el=>naturalBlockHeight(el));
    const titleUsed=titleHeights.reduce((a,b)=>a+b,0);
    titleRemainder=Math.max(0,BUDGET-titleUsed);
    bodyBlocks=blocks.slice(titleBreakIdx+1);
    bodyStartY=PAGE_H+GAP; // where the body's own continuous sheet begins, right after the title page's fixed page
  }
  const heights=bodyBlocks.map(el=>naturalBlockHeight(el));
  const padTops=bodyBlocks.map(el=>lineOwnPaddingTop(el));
  const cumulativeY=[]; { let acc=0; for(let i=0;i<heights.length;i++){ cumulativeY.push(acc); acc+=heights[i]; } }

  let used=0, pageStart=0;
  const bodyBoundaries=[]; // {y, padTop} relative to the body's own start -- where a new notional page begins within the body
  for(let i=0;i<bodyBlocks.length;i++){
    used+=heights[i];
    const heightBreak=used>BUDGET && i>pageStart;
    const forcedBreak=!heightBreak && bodyBlocks[i].dataset.forceBreak==='1' && i+1<bodyBlocks.length;
    if(heightBreak){
      let breakIdx=i;
      if(bodyBlocks[i-1] && bodyBlocks[i-1].dataset.type==='character' && breakIdx-1>pageStart){ breakIdx=i-1; }
      bodyBoundaries.push({y:cumulativeY[breakIdx], padTop:padTops[breakIdx]});
      pageStart=breakIdx;
      used=0;
      i=breakIdx-1;
    } else if(forcedBreak){
      bodyBoundaries.push({y:cumulativeY[i+1], padTop:padTops[i+1]});
      pageStart=i+1;
      used=0;
    }
  }
  // Single source of truth for both the page indicator (currentPhysicalPage)
  // and page-number labels below -- when there's a title page, index 0
  // always marks the start of physical page "2" (the first script page,
  // right after the title page) via a synthetic boundary at bodyStartY, the
  // same way currentPhysicalPage() has always counted physical pages one
  // boundary-crossing at a time; every subsequent entry is a real
  // body-internal page break, offset into document-absolute Y.
  continuousPageBoundaries = hasTitlePage
    ? [{y:bodyStartY, padTop:padTops[0]||0}, ...bodyBoundaries.map(b=>({y:b.y+bodyStartY, padTop:b.padTop}))]
    : bodyBoundaries;
  totalPageCount=continuousPageBoundaries.length+1;

  // Everything above is cheap, in-memory math and always kept current so
  // things like the page indicator and click-to-page mapping never go
  // stale. Below is the only DOM-mutating part -- removing/reinserting the
  // title-page spacer (a contentEditable=false node sitting in the middle of
  // the live editable flow) and rebuilding the page-number overlay -- and
  // it's gated behind a signature check exactly like normal pagination's own
  // _lastPaginationSig, and for the same hard rule (pagination must not
  // touch the DOM unless the actual page breaks changed). Without this gate,
  // recomputePaginationContinuous ran this DOM churn on literally every
  // keystroke anywhere in the document, even when nothing about where pages
  // break had changed at all -- tearing down and rebuilding the spacer node
  // on every edit, which was destabilizing the surrounding paragraphs'
  // rendered spacing as you typed (the reported "line spacing changes"
  // bug). This mode intentionally uses its own _lastContinuousSig rather
  // than sharing normal pagination's _lastPaginationSig, since the two
  // modes' DOM output (spacer count/placement, dialogue splits) are
  // structurally different and a signature meaningful for one is not
  // meaningful for the other.
  const sig=(hasTitlePage?('T:'+titleRemainder):'NT')+'||'+bodyBoundaries.map(b=>b.y).join(',');
  if(sig===_lastContinuousSig && !_forcePaginationRebuild){ updatePageIndicator(); return; }
  _lastContinuousSig=sig;
  _lastPaginationSig=null; _forcePaginationRebuild=false; // this mode never uses the *normal* mode's own signature cache
  content.querySelectorAll('.page-spacer').forEach(n=>n.remove());
  content.querySelectorAll('.dlg-gap-spacer').forEach(n=>n.remove());
  if(dialogueLabelsLayer) dialogueLabelsLayer.innerHTML='';
  if(hasTitlePage){
    const spacer=document.createElement('div');
    spacer.className='page-spacer';
    spacer.contentEditable='false';
    spacer.style.height=(titleRemainder+M_BOTTOM+GAP+M_TOP)+'px';
    blocks[titleBreakIdx+1].before(spacer);
  }
  renderPageDecorContinuous(continuousPageBoundaries, hasTitlePage, bodyStartY);
  updatePageIndicator();
}
function renderPageDecorContinuous(boundaries, hasTitlePage, bodyStartY){
  pageDecor.innerHTML='';
  bodyStartY=bodyStartY||0;
  if(hasTitlePage){
    // The title page keeps the exact same fixed-size .page-sheet normal
    // pagination uses -- not the auto-height continuous strip -- so it
    // reads as a genuinely separate page, the way a word processor's
    // continuous view still shows a distinct title/cover page.
    const titleSheet=document.createElement('div');
    titleSheet.className='page-sheet';
    titleSheet.style.top='0px';
    pageDecor.appendChild(titleSheet);
  }
  const bodyTotalHeight=Math.max((content.scrollHeight||0)-bodyStartY, M_TOP+M_BOTTOM+BUDGET);
  const sheet=document.createElement('div');
  sheet.className='page-sheet page-sheet-continuous';
  sheet.style.top=bodyStartY+'px';
  sheet.style.height=bodyTotalHeight+'px';
  pageDecor.appendChild(sheet);
  const skipPages=hasTitlePage?2:1; // title (unnumbered) + first script page (unnumbered)
  boundaries.forEach((b,idx)=>{
    const pageIndex=idx+1; // boundaries[0] marks the start of physical page 1 (0-based index 1)
    if(pageIndex>=skipPages){
      const num=document.createElement('div');
      num.className='page-number page-number-continuous';
      // No +48 offset here (unlike renderPageDecor's discrete-page version):
      // in Continuous View there's no gap between pages to sit inside, so the
      // label sits directly level with the topmost paragraph of the new page
      // -- making it visually clear that paragraph used to start a new page.
      // b.y itself marks the top of that paragraph's full layout box, which
      // for most element types includes its own 16px padding-top gap above
      // the actual glyphs (Dialogue/Parenthetical have none) -- add it back
      // so the label lines up with the text itself, not the empty space
      // above it.
      num.style.top=(b.y+(b.padTop||0))+'px';
      num.textContent=(pageIndex-skipPages+2)+'.';
      pageDecor.appendChild(num);
    }
  });
}
function setContinuousView(on){
  continuousView=on;
  content.querySelectorAll('.page-spacer').forEach(n=>n.remove());
  content.querySelectorAll('.dlg-gap-spacer').forEach(n=>n.remove());

  _lastPaginationSig=null; _lastContinuousSig=null; _forcePaginationRebuild=false;

  // appeared or disappeared) -- reposition every note/connector/drawing
  // against their anchor paragraphs' new positions.

}
const scheduleReflow=debounce(function(){
  recomputePagination(); layoutAllNotes(); renderDrawLayer(); renderTextHighlights();
  if(state.activeTab.left==='scenes') renderSidebar('left');

/* =========================================================
   COORDINATES / CAMERA
   ========================================================= */
function lineWorldTop(lineEl){
  let y=0, el=lineEl;
  while(el && el!==world){ y+=el.offsetTop; el=el.offsetParent; }
  return y;
}
function screenToWorld(clientX, clientY){
  const r=viewport.getBoundingClientRect();
  const sx=clientX-r.left, sy=clientY-r.top;
  return {x:(sx-pan.x)/zoom, y:(sy-pan.y)/zoom};
}
function lineTextEdgeWorldX(lineEl, side){
  let rect;
  if(lineEl.textContent && lineEl.textContent.length){
    const r=document.createRange();
    r.selectNodeContents(lineEl);
    rect=r.getBoundingClientRect();
  } else {
    rect=lineEl.getBoundingClientRect();
  }
  if(!rect || (rect.width===0 && rect.height===0)){
    rect=lineEl.getBoundingClientRect();
  }
  const clientX = side==='left' ? rect.left : rect.right;
  return screenToWorld(clientX, rect.top).x;
}
function applyTransform(){
  world.style.transform='translate('+pan.x+'px,'+pan.y+'px) scale('+zoom+')';
  updatePageIndicator();
}
/* Word-style "Page X of Y", always visible while a project is open, tracking
   whichever physical page is currently centered in the viewport as the user
   scrolls/pans — recomputed on every pan/zoom change (applyTransform) and
   whenever the total page count itself changes (recomputePagination). */
let totalPageCount=1;
function currentPhysicalPage(){
  const vr=viewport.getBoundingClientRect();
  const centerWorld=screenToWorld(vr.left+vr.width/2, vr.top+vr.height/2);
  if(continuousView){
    let page=1;
    for(let i=0;i<continuousPageBoundaries.length;i++){
      if(centerWorld.y>=continuousPageBoundaries[i].y) page=i+2; else break;
    }
    return clamp(page,1,Math.max(1,totalPageCount));
  }
  const idx=Math.floor(centerWorld.y/(PAGE_H+GAP));
  return clamp(idx,0,Math.max(0,totalPageCount-1))+1;
}
function updatePageIndicator(){
  const el=document.getElementById('pageIndicator');

  const cur=currentPhysicalPage();
  const label='Page '+cur+' of '+totalPageCount;
  if(el.textContent!==label) el.textContent=label;
  let leftOffset=20;
  if(state.panelsVisible.left){
    const sb=document.getElementById('leftSidebar');
    if(sb) leftOffset = sb.getBoundingClientRect().right + 20;
  }
  el.style.left=leftOffset+'px';
  // The timeline (Living Script) bar is a fixed 56px tall strip pinned to the
  // bottom of the viewport when open -- without this, the badge's own default
  // 20px-from-bottom position lands squarely inside that strip's left end.
  el.style.bottom = (state.panelsVisible.timeline ? 56+20 : 20)+'px';
}
function animateTransformTo(newPan, newZoom, cb){

}
function zoomAt(sx, sy, newZoom){

function fitInitialView(){

/* =========================================================
   NOTES
   ========================================================= */
function allLineEls(){ return Array.from(content.querySelectorAll('.line-block')); }
function nearestLineToWorldY(worldY){
  const lines=allLineEls();
  if(!lines.length) return null;
  let best=lines[0], bestD=Infinity;
  lines.forEach(l=>{
    const top=lineWorldTop(l)+l.offsetHeight/2;
    const d=Math.abs(top-worldY);
    if(d<bestD){ bestD=d; best=l; }
  });
  return best;
}
/* Anything in the empty margin+gap area between two consecutive paragraphs
   that actually sit on DIFFERENT pages (a real page break -- bottom
   margin + canvas gap + top margin, ~220+ world units, never confusable
   with a normal 0-16px paragraph gap) belongs to whichever side of the
   *physical gap's own midpoint* it falls on: the upper page's last
   paragraph above that line, the lower page's first paragraph below it.
   nearestLineToWorldY's "closest paragraph by its own center" doesn't
   line up with this -- a tall multi-line paragraph's center sits well
   above its own bottom edge, which shifts the effective split point away
   from the actual visual gap between the pages. Measuring the real gap
   between consecutive lines directly (rather than assuming fixed page
   math) means this works the same whether the break is a plain page
   break or a force-broken one (e.g. after the Title Page).
*/
function lineForPageGap(worldY){
  const lines=allLineEls();
  for(let i=0;i<lines.length-1;i++){
    const aBottom=lineWorldTop(lines[i])+lines[i].offsetHeight;
    const bTop=lineWorldTop(lines[i+1]);
    if(bTop-aBottom>64 && worldY>=aBottom && worldY<bTop){
      return worldY<(aBottom+bTop)/2 ? lines[i] : lines[i+1];
    }
  }
  return null;
}
function resolveAnchorLine(worldX, worldY, explicitLineId){
  if(explicitLineId){ const el=content.querySelector('[data-id="'+explicitLineId+'"]'); if(el) return el; }
  if(highlightedLineId){ const el=content.querySelector('[data-id="'+highlightedLineId+'"]'); if(el) return el; }
  return lineForPageGap(worldY) || nearestLineToWorldY(worldY);
}
function panIntoViewIfNearEdge(worldX, worldY, margin){
  const r=viewport.getBoundingClientRect();

/* Every shot whose range includes this paragraph, naturally sorted (see

   ranges are possible (e.g. two shots deliberately covering the same
   beat), so this always returns every match rather than assuming one. */
function shotsForLineId(lineId){

}
function linesTouchedBySelection(){

function createNote(kind, worldX, worldY, explicitLineId, extraLineIds){

    const pos=findClearPosition(worldX-w/2, worldY-h/2, w, h, null);

      folded:false, text:'', keyword:'', category:null, shotId:null, shootDay:'',
      createdAt:Date.now()

    createNoteDOM(note);

}
function noteKindLabel(k){ return k==='dot'?'Dot Note':k==='sticky'?'Sticky Note':'Drawing'; }
function createNoteForBlock(kind, block){

function migrateNote(note){
  if(note.pendingShotNumber===undefined) note.pendingShotNumber=null;
  if(note.kind==='sticky'){
    if(note.stickyX===undefined){ note.stickyX = note.dotX!==undefined ? note.dotX : (note.side==='left'?-100:PAGE_W+100); note.stickyY = note.dotY!==undefined ? note.dotY : 200; }
    return note;
  }
  if(note.parentNoteId){
    if(note.freeX===undefined || note.freeY===undefined){
      note.freeX = note.dotX!==undefined ? note.dotX : 40;
      note.freeY = note.dotY!==undefined ? note.dotY : 40;
    }
    if(!note.anchorLineIds) note.anchorLineIds=[];
    if(note.category===undefined) note.category=null;
    return note;
  }
  if(!note.anchorLineIds){ note.anchorLineIds = note.anchorLineId ? [note.anchorLineId] : []; }
  delete note.anchorLineId;
  if(note.dotX===undefined || note.dotY===undefined){
    const primaryId=note.anchorLineIds[0];
    const line=primaryId ? content.querySelector('[data-id="'+primaryId+'"]') : null;
    const lineTop = line ? lineWorldTop(line) : 200;
    note.dotY = lineTop + (note.yNudge||8);
    note.dotX = note.side==='left' ? (0-(note.offsetX||60)) : (PAGE_W+(note.offsetX||60));
  }

  // has run by the time migrateNote() executes, but recomputePagination()
  // has not (see enterEditor's call order), so content's line-blocks are
  // still sitting at their pre-pagination positions (no page-spacers
  // inserted yet) -- computing an offset against that would capture the
  // wrong value for anything past the first page. Left undefined here and
  // back-filled lazily in reanchorDotsToParagraphs() instead, the first
  // time layoutAllNotes() runs (always after recomputePagination() in
  // every real load path), against the actual, correctly-paginated
  // position.
  if(note.cardOffsetX===undefined) note.cardOffsetX = 60;
  if(note.cardYOffset===undefined) note.cardYOffset = 0;

function migrateNotes(list){ return (list||[]).map(migrateNote); }
function applyCategoryColor(note){

  els.dot.style.background = note.kind==='sticky' ? '' : baseColor;
  els.card.style.background = tintColor(baseColor, note.kind==='sticky' ? 0.78 : 0.9);

function createNoteDOM(note){

function wireCanvasDrawing(cvs, note, clearBtn){
  const ctx=cvs.getContext('2d');
  ctx.strokeStyle='#8B7439'; ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round';
  if(note.drawingData){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,cvs.width,cvs.height); img.src=note.drawingData; }
  let drawing=false, last=null;
  function posFromEvent(e){
    const r=cvs.getBoundingClientRect();
    return {x:(e.clientX-r.left)*(cvs.width/r.width), y:(e.clientY-r.top)*(cvs.height/r.height)};
  }
  cvs.addEventListener('pointerdown', function(e){ e.stopPropagation(); drawing=true; last=posFromEvent(e); cvs.setPointerCapture(e.pointerId); });
  cvs.addEventListener('pointermove', function(e){
    if(!drawing) return; e.stopPropagation();
    const p=posFromEvent(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last=p;
  });
  function endDraw(e){
    if(!drawing) return; drawing=false;
    note.drawingData=cvs.toDataURL('image/png');
    scheduleSnapshot(); scheduleAutosave();
  }
  cvs.addEventListener('pointerup', endDraw);
  cvs.addEventListener('pointerleave', endDraw);
  clearBtn.addEventListener('click', function(e){ e.stopPropagation(); ctx.clearRect(0,0,cvs.width,cvs.height); note.drawingData=null; scheduleSnapshot(); scheduleAutosave(); });
}

function updateNote(id, patch){

/* Immediately (no animation, no transition) removes just the dashed

   link down to it (if it has any) — without touching anything else already
   drawn in #connectorLayer. Per an explicit request, an Additional Note's
   dashed links are meant to snap off/on instantly on fold/unfold rather
   than animate (unlike a regular Dot Note's solid paragraph-connector,
   which still retracts/extends via animateConnectorForNote as before) —
   see that function's own :not(.connector-extra) exclusion below. */

  const ids=[note.id, ...state.notes.filter(o=>o.parentNoteId===note.id).map(o=>o.id)];

/* Animates every connector line belonging to this note — a note can have more

   retract/extend together, not just the first one found. Each animates
   independently using its own SVG stroke-dash "draw/erase" so it visibly
   retracts into — or extends out of — its start point rather than just
   popping in/out. Deliberately excludes .connector-extra (an Additional

   handled separately by removeExtraConnectorsFor() on fold and by the
   normal updateConnectors() sweep on unfold — see that exclusion's comment
   just above. */
function animateConnectorForNote(note, duration, growing, cb){
  const paths=connectorLayer.querySelectorAll('[data-note-id="'+note.id+'"]:not(.connector-extra)');
  if(!paths.length){ if(cb) cb(); return; }
  // Use each path's own real length (SVGGeometryElement.getTotalLength()) rather
  // than the `pathLength` attribute's normalized-to-100 trick — pathLength has
  // known cross-browser inconsistencies specifically for curved (bezier) paths,
  // where the dash animation could fail to play at all. getTotalLength() works
  // correctly for straight and curved paths alike.
  paths.forEach(path=>{
    let len=100;
    try{ len=path.getTotalLength()||100; }catch(e){}
    path._foldAnimLen=len;
    path.style.strokeDasharray=len;
    path.style.transition='none';
    path.style.strokeDashoffset = growing ? len : 0;
  });
  void connectorLayer.getBoundingClientRect();
  paths.forEach(path=>{
    path.style.transition='stroke-dashoffset '+duration+'ms ease-'+(growing?'out':'in');
  });
  requestAnimationFrame(()=>{
    paths.forEach(path=>{ path.style.strokeDashoffset = growing ? '0' : (path._foldAnimLen||100); });
  });
  setTimeout(()=>{

function layoutNote(note){

  els.wrap.dataset.kind=note.kind;

  if(note.kind==='sticky'){
    els.wrap.classList.add('is-open');
    const w=note.width||STICKY_W_DEFAULT, h=note.height||STICKY_SIZE_DEFAULT;
    els.card.style.width=w+'px';
    if(note.height){ els.card.style.height=h+'px'; els.card.style.minHeight='0'; } else { els.card.style.height=''; els.card.style.minHeight=''; }

    els.card.style.top=(note.stickyY-h/2)+'px';
    return {x:note.stickyX, y:note.stickyY};
  }

  if(note.parentNoteId){
    // Additional Note: no dot, no paragraph anchor — freely positioned by
    // note.freeX/freeY (its card's own top-left, in world coordinates).

    els.card.style.width=cardW+'px';

    els.card.style.top=note.freeY+'px';

  els.card.style.width=cardW+'px';
  if(note.height){ els.card.style.height=note.height+'px'; } else { els.card.style.height=''; }

  // via their own dotY+cardYOffset math rather than a rendered box, so this
  // still works even mid-layout, before either note's card.style.top has
  // necessarily caught up to its data.
  const sameSideNotes=state.notes.filter(n=>n.id!==note.id && n.kind!=='sticky' && !n.parentNoteId && n.side===note.side && !n.folded && noteEls[n.id]);

  // landing on: Sticky Notes and Additional Notes (both freely positioned,
  // at any X, not just this note's own margin) and Drawings -- checked via
  // their real rendered/bounding boxes.
  const otherBoxes=[];

    if(n.id===note.id || n.folded) return;
    if(n.kind==='sticky' || n.parentNoteId){

      if(b) otherBoxes.push(b);
    }

    const b=drawingBBox(dw);

    changed=false; iterations++;

/* Keeps each Dot Note's dot anchored to the exact spot along its paragraph

   its anchor paragraph's own top, recorded once at creation and re-recorded
   whenever the dot itself is manually dragged (see attachDragReposition's
   'dot' branch) -- everywhere else, it's treated as fixed, and dotY is
   simply re-derived from wherever the anchor paragraph currently sits.
   Run once per layout pass, before layoutNote()/updateConnectors() read
   dotY, so the card (positioned from dotY+cardYOffset) automatically comes

   handling needed for it. */

  state.notes.forEach(n=>{
    if(n.kind!=='dot' || n.parentNoteId) return;

    if(!lineId) return;
    const line=content.querySelector('[data-id="'+lineId+'"]');
    if(!line) return;
    if(n.dotAnchorOffsetY===undefined){
      // First time seeing this note since load (an older saved note that
      // predates dotAnchorOffsetY, or one whose fallback dotX/dotY was just
      // assigned above in migrateNote) -- back-fill from its current
      // (already-paginated, by the time layoutAllNotes() runs this) dot and
      // anchor-line position, so it starts following its paragraph as of
      // right now rather than staying at a fixed world position forever.
      n.dotAnchorOffsetY = n.dotY - lineWorldTop(line);

    }

      // explicit request): Additional Notes use a plain world freeX/freeY,
      // not a paragraph anchor, so they'd otherwise never move when their
      // own root's paragraph does. dragGroupFor(n) is n plus everything
      // hanging off it, so shifting every OTHER member by the same delta
      // moves the whole hierarchy together and keeps their existing
      // relative layout, exactly like manually dragging the Original Note
      // already does.
      dragGroupFor(n).forEach(other=>{ if(other.id!==n.id && other.parentNoteId) other.freeY+=deltaY; });

/* =========================================================
   TEXT-ONLY HIGHLIGHTING (cursor / notes / dots / shots / find)
   ---------------------------------------------------------
   Renders tight, text-hugging highlight rectangles into #highlightLayer,
   computed from Range.getClientRects() (one rect per wrapped visual line) so
   the color only ever covers actual glyphs — never the paragraph's padding,
   margins, or trailing whitespace. This is now the ONLY highlight mechanism
   in the app: the plain "the text cursor is in this paragraph" case used to
   get its own separate, full-row treatment (a .active-highlight CSS class
   with a wide box-shadow spread reaching out past the paragraph's own
   column into the surrounding margins) — removed per an explicit request,
   since the tight, text-hugging system below already fully covers what that
   was for, and having two different highlight mechanisms risked exactly the
   kind of visual mismatch (a full-width bar bleeding across the page vs. a
   clean text-hugging block) this unification eliminates.

  return rects.filter(rc=>rc.width>0.5 && rc.height>0.5).map(rc=>{
    const tl=screenToWorld(rc.left, rc.top);
    const br=screenToWorld(rc.right, rc.bottom);

   #screenplayContent (see the ::selection CSS rule) and replaced by this
   custom overlay, because native selection rects go wrong in two
   confirmed ways once a selection spans more than one .line-block:

        gets painted as its own full layout box (the block's whole column
        width, and its own padding-top gap above the text) instead of its
        actual glyphs -- dramatically so for a type like Character, which
        has no fixed width and runs to the far edge of the column even

        that doesn't happen to fill its own width. This is exactly the

        becomes real, visible double-painted overlap at any zero-gap

        padding-top is 0 by design) -- exactly the "highlights overlap
        between paragraphs" bug. Insetting each rect by half the overflow
        on its top and bottom below removes it: two adjacent zero-gap rows

    const insetY=Math.max(0, (rc.height-LINE_H*zoom)/2);
    const tl=screenToWorld(rc.left, rc.top+insetY);

   or the empty gap itself would get painted across. setEndBefore/

/* A block's own layout box IS its type's fixed column width (an explicit
   CSS width for Dialogue/Parenthetical/Lyrics, or the full available column
   width for everything else) -- using it directly for a highlight's
   left/right edges, instead of Range.getClientRects()' actual glyph extent,
   guarantees the highlight never changes width based on how long any given
   line or sentence happens to be. */
function worldRectForBlockBox(lineEl){
  const r=lineEl.getBoundingClientRect();

  // 16px normally or 0 for a Dialogue/Parenthetical sitting directly under
  // a Character cue) so the highlight's top edge sits flush with the text
  // itself, matching the bottom edge, which is already flush since no
  // .line-block type ever has padding-bottom. Left/right keep using the
  // block's own column box unchanged, per the existing design above.

/* The actual paragraph-highlight geometry used for cursor/note/shot

   matched substring so the user can see precisely where a match sits — see
   the findMatches loop further down, which still calls
   worldRectsForRange/textOffsetToNodeOffset directly against the tight
   match range, unchanged.

   Action — sized to the paragraph's own fixed column box top-to-bottom (an
   explicit CSS width for Dialogue/Parenthetical/Lyrics, or the full
   available column width for full-width types), so the highlight never
   changes width based on how long any given line happens to be, and a
   wrapping paragraph always renders as one clean, uniform block with no
   possibility of two rects overlapping on a shared line. (Action used to
   be split per-sentence here, each sentence getting its own rect from that
   sentence's own rendered extent — but since every rect still used the
   *same* fixed-box width regardless, splitting bought nothing visually and
   whenever two sentences shared a physical line, both sentences' rects
   covered that line, double-stacking the highlight's opacity there and
   making it look darker than the rest of the paragraph. Removed.)
   Since every paragraph gets exactly one rect and adjacent paragraphs'

   flow), two different highlighted paragraphs can never double-stack at a
   shared boundary either — the "no overlap across line breaks" guarantee
   holds both within one paragraph and across paragraphs. */
function worldRectsForParagraphHighlight(lineEl){
  if(!lineEl || !lineEl.textContent || !lineEl.textContent.length) return [];
  const spacer=lineEl.querySelector('.dlg-gap-spacer');
  if(!spacer) return [worldRectForBlockBox(lineEl)];
  // A Dialogue block with a "(MORE)"/"CONT'D" split has a large internal
  // gap reserved for the page transition -- highlighting the block's own
  // full bounding box top-to-bottom (the normal one-rect approach above)
  // would paint straight across that empty gap, visually bridging the
  // "(MORE)" side on one page to the continuation on the next. Split into
  // two rects instead, one for the portion before the spacer and one for
  // the portion after, using the same fixed-column-width treatment as
  // everything else -- so a highlighted split Dialogue paragraph shows two
  // clean blocks (one per page) with nothing painted across the gap
  // between them.
  const box=worldRectForBlockBox(lineEl);
  const blockRect=lineEl.getBoundingClientRect();
  const spacerRect=spacer.getBoundingClientRect();
  const out=[];
  const beforeTop=screenToWorld(0, blockRect.top).y;
  const beforeBottom=screenToWorld(0, spacerRect.top).y;
  if(beforeBottom-beforeTop>0.5) out.push({x:box.x, y:beforeTop, w:box.w, h:beforeBottom-beforeTop});

  const afterBottom=screenToWorld(0, blockRect.bottom).y;

}

function renderTextHighlights(){

    // mismatched pair bakes in a wrong world position that then stays
    // wrong even after the animation finishes, since world coordinates are

    // instant the transition (always exactly one, never nested) ends.

/* A "drawing" is a whole pen SESSION (everything drawn from tool-select to

const imagesLayer=document.getElementById('imagesLayer');
const IMAGE_MAX_DIM=420; // initial on-canvas size cap; natural aspect ratio preserved, user can resize freely after

  if(readOnlyMode) return;
  let blob=null;

    if(navigator.clipboard && navigator.clipboard.read){
      const items=await navigator.clipboard.read();
      for(const item of items){
        const type=item.types.find(t=>t.startsWith('image/'));
        if(type){ blob=await item.getType(type); break; }
      }
    }
  }catch(err){ /* permission denied, unsupported, or nothing image-typed on the clipboard -- fall through to the file-picker fallback */ }

  // iPadOS Safari without an explicit user gesture already inside a paste
  // handler, or simply because there's no image on the clipboard right now)

      const w=Math.round(natW*scale), h=Math.round(natH*scale);

        id:uid('img'), x:worldX-w/2, y:worldY-h/2, width:w, height:h, dataUrl,

    };

    if(e.button!==0) return;
    if(readOnlyMode) return;
    e.preventDefault(); e.stopPropagation();
    down=true;
    const w=screenToWorld(e.clientX, e.clientY);
    grabOffsetX=w.x-img.x; grabOffsetY=w.y-img.y;
    wrap.classList.add('dragging');
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', function(e){
    if(!down) return;
    const w=screenToWorld(e.clientX, e.clientY);
    img.x=w.x-grabOffsetX; img.y=w.y-grabOffsetY;
    positionImageEl(img);
  });
  function finish(e){
    if(!down) return;
    down=false; wrap.classList.remove('dragging');
    try{ wrap.releasePointerCapture(e.pointerId); }catch(err){}
    scheduleSnapshot(); scheduleAutosave();
  }
  wrap.addEventListener('pointerup', finish);
  wrap.addEventListener('pointercancel', finish);
}
function attachImageResize(handleEl, img, corner){
  let down=false, startW=0, startH=0, startX=0, startY=0, aspect=1;
  handleEl.addEventListener('pointerdown', function(e){
    if(e.button!==0) return;
    if(readOnlyMode) return;
    e.stopPropagation(); e.preventDefault();
    down=true;
    startW=img.width; startH=img.height; startX=img.x; startY=img.y;
    aspect=startW/Math.max(1,startH);
    handleEl.setPointerCapture(e.pointerId);
  });
  handleEl.addEventListener('pointermove', function(e){
    if(!down) return;
    const w=screenToWorld(e.clientX, e.clientY);
    let newW = corner==='br' ? Math.max(30, w.x-startX) : Math.max(30, (startX+startW)-w.x);
    const newH=Math.max(30, newW/aspect);
    newW=newH*aspect;
    if(corner==='bl'){ img.x=startX+startW-newW; }
    img.width=newW; img.height=newH;
    positionImageEl(img);
  });
  function finish(e){
    if(!down) return;
    down=false;
    try{ handleEl.releasePointerCapture(e.pointerId); }catch(err){}
    scheduleSnapshot(); scheduleAutosave();
  }
  handleEl.addEventListener('pointerup', finish);
  handleEl.addEventListener('pointercancel', finish);
}
function renderDrawLayer(){
  drawLayer.innerHTML='';
  state.drawings.forEach(dw=>{
    renderConnectorForDrawing(dw);
    (dw.strokes||[]).forEach(st=>appendStrokePath(dw.id, st));
  });
  renderDrawingSelection();
}
function renderLiveDrawing(stroke){
  let path=drawLayer.querySelector('[data-live="1"]');
  if(!path){
    path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('class','drawing-path');
    path.setAttribute('stroke', stroke.color||currentDrawColor);
    path.setAttribute('stroke-width', String(stroke.width||2.5));
    path.dataset.live='1';
    drawLayer.appendChild(path);
  }
  path.setAttribute('d', pointsToPath(stroke.points));
}
/* ---- drawing move / resize (Select tool) ---- */
let drawDragState=null;
function onDrawingDragMove(e){
  if(!drawDragState) return;
  const w=screenToWorld(e.clientX, e.clientY);
  const dw=state.drawings.find(x=>x.id===drawDragState.id); if(!dw) return;
  if(drawDragState.mode==='move'){
    const dx=w.x-drawDragState.lastX, dy=w.y-drawDragState.lastY;
    drawDragState.lastX=w.x; drawDragState.lastY=w.y;
    dw.strokes.forEach(st=>{ for(let i=0;i<st.points.length;i+=2){ st.points[i]+=dx; st.points[i+1]+=dy; } });
  } else if(drawDragState.mode==='resize'){
    const b=drawDragState.bbox;
    const w0=Math.max(1,b.maxX-b.minX), h0=Math.max(1,b.maxY-b.minY);
    let anchorX, scaleX;
    if(drawDragState.corner==='br'){ anchorX=b.minX; scaleX=(w.x-anchorX)/w0; }
    else { anchorX=b.maxX; scaleX=(anchorX-w.x)/w0; }
    const anchorY=b.minY;
    let scaleY=(w.y-anchorY)/h0;
    scaleX=clamp(scaleX,0.2,6); scaleY=clamp(scaleY,0.2,6);
    dw.strokes.forEach((st,si)=>{
      const orig=drawDragState.snapshot[si];
      for(let i=0;i<st.points.length;i+=2){
        const ox=orig[i], oy=orig[i+1];
        st.points[i] = drawDragState.corner==='br' ? (anchorX+(ox-b.minX)*scaleX) : (anchorX-(b.maxX-ox)*scaleX);
        st.points[i+1] = anchorY+(oy-b.minY)*scaleY;
      }
    });
  }
  renderDrawLayer();
}
function onDrawingDragUp(){
  if(!drawDragState) return;
  drawDragState=null;
  window.removeEventListener('pointermove', onDrawingDragMove);
  window.removeEventListener('pointerup', onDrawingDragUp);
  scheduleSnapshot(); scheduleAutosave();
}
function startDrawingBodyDrag(id, e){
  const w0=screenToWorld(e.clientX, e.clientY);
  drawDragState={id, mode:'move', lastX:w0.x, lastY:w0.y};
  window.addEventListener('pointermove', onDrawingDragMove);
  window.addEventListener('pointerup', onDrawingDragUp);
}
function startDrawingResize(id, corner, e){
  const dw=state.drawings.find(x=>x.id===id); if(!dw) return;
  const bbox=drawingBBox(dw);
  const snapshot=dw.strokes.map(st=>st.points.slice());
  drawDragState={id, mode:'resize', corner, bbox, snapshot};
  window.addEventListener('pointermove', onDrawingDragMove);
  window.addEventListener('pointerup', onDrawingDragUp);
}

}

/* =========================================================
   SCENES & SHOTS
   ========================================================= */
function getScenes(){
  let lines=allLineEls();
  const titleBreakIdx=lines.findIndex(l=>l.dataset.forceBreak==='1');
  if(titleBreakIdx>=0){ lines=lines.slice(titleBreakIdx+1); }
  const scenes=[];
  let cur=null;
  lines.forEach(l=>{
    if(l.dataset.type==='scene_heading'){
      cur={id:l.dataset.id, heading: l.textContent ? l.textContent.toUpperCase() : '(untitled scene)', lineIds:[l.dataset.id]};
      scenes.push(cur);
    } else if(cur){ cur.lineIds.push(l.dataset.id); }
    // Content before the first Scene Heading isn't tracked as its own scene —
    // the first real Scene Heading in the script is always Scene 1.
  });
  return scenes;
}
function shotsForScene(sceneId){ return state.shots.filter(s=>s.sceneId===sceneId).sort((a,b)=>naturalCompare(a.number,b.number)); }
function shotLineRange(shot){
  const ids=allLineEls().map(l=>l.dataset.id);
  const s=ids.indexOf(shot.startLineId), e=ids.indexOf(shot.endLineId);
  if(s<0||e<0) return [];
  return ids.slice(Math.min(s,e), Math.max(s,e)+1);
}
/* Natural sort: "2" < "2A" < "3" < "10", falling back to plain string compare */
function naturalCompare(a,b){
  a=String(a==null?'':a); b=String(b==null?'':b);
  const re=/(\d+)|(\D+)/g;
  const ax=a.match(re)||[], bx=b.match(re)||[];
  const len=Math.max(ax.length,bx.length);
  for(let i=0;i<len;i++){
    const av=ax[i]||'', bv=bx[i]||'';
    const an=/^\d+$/.test(av), bn=/^\d+$/.test(bv);
    if(an && bn){ const d=Number(av)-Number(bv); if(d) return d; }
    else { const c=av.localeCompare(bv); if(c) return c; }
  }
  return 0;
}
function orderedShots(){ return state.shots.slice().sort((a,b)=>naturalCompare(a.number,b.number)); }
function orderedShootDays(){
  const days=[...new Set(state.notes.map(n=>n.shootDay).filter(Boolean))];
  return days.sort(naturalCompare);
}
/* Reconnects every note that was orphaned from a deleted shot (see
   deleteShot below) back to a shot of the SAME number the moment one
   exists again -- whether that's this exact shot being freshly created, or
   an unrelated later action that happens to reuse the number. Matching is
   case-insensitive, same convention as every other shot-number lookup. */
function reconnectPendingShotNotes(shot){
  let changed=false;
  state.notes.forEach(n=>{
    if(n.pendingShotNumber && n.pendingShotNumber.toLowerCase()===shot.number.toLowerCase()){
      n.shotId=shot.id; n.pendingShotNumber=null;
      refreshShotInputValue(n.id);
      changed=true;
    }
  });
  if(changed) refreshFilterOptions();
}
function findOrCreateShotByNumber(numberStr, anchorLineIds){
  numberStr=numberStr.trim();
  let shot=state.shots.find(s=>s.number && s.number.toLowerCase()===numberStr.toLowerCase());
  if(!shot){
    const ids=Array.isArray(anchorLineIds) ? anchorLineIds.filter(Boolean) : (anchorLineIds ? [anchorLineIds] : []);
    // Paragraph-based by default: a shot created implicitly from a note's
    // Shot # field starts its range spanning every one of the note's own
    // anchor paragraphs (a note anchored to several lines at once -- e.g.
    // Ctrl+N with a multi-line selection -- gets a range covering all of
    // them, not just whichever one happened to be the selection's own focus
    // point), rather than no range at all -- so it's immediately
    // clickable/highlightable in the Shot List like any other shot, and
    // every other note whose dot sits within that same range (see
    // shotsForLineId in createNote) will pick it up automatically too. A
    // shot created with no known anchor at all (rare -- would require
    // calling this with anchorLineIds omitted) keeps the old no-range
    // behavior.
    let startLineId=null, endLineId=null;
    if(ids.length){
      const allIds=allLineEls().map(l=>l.dataset.id);
      const indices=ids.map(id=>allIds.indexOf(id)).filter(i=>i>=0);
      if(indices.length){
        startLineId=allIds[Math.min(...indices)];
        endLineId=allIds[Math.max(...indices)];
      }
    }
    let sceneId=null;
    const primaryAnchor=startLineId||ids[0]||null;
    if(primaryAnchor){
      const scenes=getScenes();
      const sc=scenes.find(s=>s.lineIds.includes(primaryAnchor));
      if(sc) sceneId=sc.id;
    }
    shot={id:uid('shot'), number:numberStr, sceneId, startLineId, endLineId};
    state.shots.push(shot);
    reconnectPendingShotNotes(shot);
    scheduleSnapshot(); scheduleAutosave();
  }
  return shot;
}
async function createShotFromSelection(){
  const sel=window.getSelection();
  if(!sel || !sel.rangeCount || sel.isCollapsed){ showToast('Select some screenplay lines first'); return; }
  const range=sel.getRangeAt(0);
  const startBlock=getCurrentBlock({focusNode:range.startContainer});
  const endBlock=getCurrentBlock({focusNode:range.endContainer});
  if(!startBlock||!endBlock){ showToast('Select some screenplay lines first'); return; }
  const scenes=getScenes();
  const scene=scenes.find(sc=>sc.lineIds.includes(startBlock.dataset.id)) || scenes[0] || null;
  const suggested=String(state.shots.length+1);
  const number=await promptModal('New Shot','Shot number', suggested);
  if(!number) return;
  const existing=state.shots.find(s=>s.number && s.number.toLowerCase()===number.trim().toLowerCase());
  if(existing){
    // Entering a number that already exists here (rather than deleting the
    // old Shot Number first and reassigning it that way) reassigns the
    // SAME shot's range to the newly selected paragraph in one step --
    // requires an explicit confirmation, since it silently overwrites
    // wherever that shot used to point.
    const ok=await confirmModal('This Shot Number already exists.',
      'Shot '+existing.number+' is already assigned elsewhere in the script. Overwrite it so it points to the current selection instead?',
      'Overwrite');
    if(!ok) return;
    existing.sceneId=scene?scene.id:null; existing.startLineId=startBlock.dataset.id; existing.endLineId=endBlock.dataset.id;
  }
  else {
    const shot={id:uid('shot'), sceneId:scene?scene.id:null, number:number.trim(), startLineId:startBlock.dataset.id, endLineId:endBlock.dataset.id};
    state.shots.push(shot);
    reconnectPendingShotNotes(shot);
  }
  renderSidebar('left'); renderSidebar('right'); refreshAllShotOptions(); refreshFilterOptions();
  scheduleSnapshot(); scheduleAutosave();
  showToast('Shot created');
}
async function deleteShot(shotId){
  if(readOnlyMode) return;
  const shot=state.shots.find(s=>s.id===shotId); if(!shot) return;
  const ok=await confirmModal('Delete Shot '+shot.number, 'This removes Shot '+shot.number+'. Notes that reference it keep remembering "'+shot.number+'" and will automatically reconnect if you create a Shot '+shot.number+' again. You can undo this with Ctrl/Cmd+Z.');
  if(!ok) return;
  if(state.activeShotId===shotId) clearShotFocus();
  state.shots=state.shots.filter(s=>s.id!==shotId);
  state.filters.shots.delete(shotId);
  // Unlink but remember: pendingShotNumber keeps the note's Shot # field
  // showing "shot.number" (see refreshShotInputValue) and lets
  // reconnectPendingShotNotes automatically relink it the moment a shot
  // with that same number exists again -- whether that's this exact number
  // recreated via "+ Shot from selection" or typed fresh into any note.
  state.notes.forEach(n=>{ if(n.shotId===shotId){ n.shotId=null; n.pendingShotNumber=shot.number; refreshShotInputValue(n.id); } });
  renderSidebar('left'); renderSidebar('right'); refreshAllShotOptions(); refreshFilterOptions(); applyFilters();
  scheduleSnapshot(); scheduleAutosave();
  showToast('Shot deleted');
}
function selectShot(shotId){
  if(state.activeShotId===shotId){ clearShotFocus(); return; }
  recomputePagination();
  setHighlightedLine(null);
  clearNoteHighlight();
  state.activeShotId=shotId;
  const shot=state.shots.find(s=>s.id===shotId); if(!shot) return;
  const lineIds=new Set(shotLineRange(shot));
  state.notes.forEach(n=>{ if(n.shotId===shotId){ (n.anchorLineIds||[]).forEach(id=>lineIds.add(id)); } });
  content.classList.add('shot-focus');
  allLineEls().forEach(l=>l.classList.toggle('shot-highlight', lineIds.has(l.dataset.id)));
  renderTextHighlights();
  // Batched (not per-note setFoldedAnimated calls): switching shots can both
  // fold one note and unfold another in the same click, and unfolding a
  // note synchronously rebuilds every connector path -- done per-note, that
  // rebuild would wipe out whichever other note's connector-animation setup
  // already happened earlier in this same loop. setFoldedBatch() sequences
  // this correctly: all state changes settle, one shared connector rebuild
  // per round, then every note's animation starts against stable paths --
  // and (by default, since this isn't filtering) any Additional-Note family
  // among the notes being unfolded reveals root-first, one hierarchy depth
  // at a time, exactly like unfolding that same family any other way would.
  const shotFocusChanges=[];
  state.notes.forEach(n=>{
    if(n.shotId===shotId){ if(n.folded) shotFocusChanges.push({id:n.id, folded:false}); }
    else { if(!n.folded) shotFocusChanges.push({id:n.id, folded:true}); }
  });
  setFoldedBatch(shotFocusChanges);
  const first=content.querySelector('[data-id="'+shot.startLineId+'"]');
  // Same top-1/4 alignment as clicking a scene in the left sidebar (see
  // MODULES.scenes' row click handler), rather than dead-centering the
  // shot's start line in the viewport.
  if(first) panToWorldPointFraction(PAGE_W/2, lineWorldTop(first), 0.25);
  renderSidebar('right');
}
function clearShotFocus(){
  state.activeShotId=null;
  content.classList.remove('shot-focus');
  allLineEls().forEach(l=>l.classList.remove('shot-highlight'));
  renderTextHighlights();
  unfoldAllNotes();
  renderSidebar('right');
}
/* Unfold every currently-folded Dot Note (Sticky Notes never fold). Used
   when a shot selection is cleared, from either the Shot List (staggered,
   the default) or the Filters panel (pass staggerUnfold=false -- filtering
   stays instant, per an explicit carve-out). */
function unfoldAllNotes(staggerUnfold){
  const changes=[];
  state.notes.forEach(n=>{
    if(n.kind!=='sticky' && n.folded) changes.push({id:n.id, folded:false});
  });
  setFoldedBatch(changes, staggerUnfold);
  return changes.length>0;
}
/* Filters-panel equivalent of selectShot()'s fold-focus: with one or more
   Shot filter chips active, fold every note not belonging to any of them and
   unfold the ones that do. Filtering stays instant/simultaneous rather than
   playing the staggered root-first reveal used everywhere else fold/unfold
   happens (Shot List selection, Fold All/Unfold All) -- an explicit
   carve-out, since a filter toggle can fire repeatedly in quick succession
   and should read as an immediate state change, not an animation to wait
   through. */
function applyShotFilterFold(){
  const activeShots=state.filters.shots;
  const changes=[];
  state.notes.forEach(n=>{
    if(n.kind==='sticky') return;
    const matches = n.shotId && activeShots.has(n.shotId);
    if(matches){ if(n.folded) changes.push({id:n.id, folded:false}); }
    else { if(!n.folded) changes.push({id:n.id, folded:true}); }
  });
  setFoldedBatch(changes, false);
}

/* =========================================================
   SIDEBAR MODULES
   ========================================================= */
const MODULES={
  scenes:{title:'Scenes', render:renderScenesModule},
  shots:{title:'Shot List', render:renderShotsModule},
  filters:{title:'Filters', render:renderFiltersModule},
  sticky:{title:'Sticky Notes', render:renderStickyModule}
};

function renderSidebar(side){
  const tabbar=document.getElementById(side+'Tabbar');
  const contentEl=document.getElementById(side+'Content');
  const mods=state.sidebarLayout[side];
  if(!mods.includes(state.activeTab[side])) state.activeTab[side]=mods[0];
  tabbar.innerHTML='';
  mods.forEach(mid=>{
    const btn=document.createElement('button');
    btn.className='tab-btn'+(state.activeTab[side]===mid?' active':'');
    btn.textContent=MODULES[mid].title;
    btn.draggable=true;
    btn.dataset.mid=mid;
    btn.addEventListener('click', ()=>{ state.activeTab[side]=mid; renderSidebar(side); });
    btn.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', JSON.stringify({mid, from:side})); btn.classList.add('drag-ghost'); });
    btn.addEventListener('dragend', ()=>btn.classList.remove('drag-ghost'));
    tabbar.appendChild(btn);
  });
  tabbar.ondragover=e=>{ e.preventDefault(); tabbar.classList.add('drop-target'); };
  tabbar.ondragleave=()=>tabbar.classList.remove('drop-target');
  tabbar.ondrop=e=>{
    e.preventDefault(); tabbar.classList.remove('drop-target');
    let data; try{ data=JSON.parse(e.dataTransfer.getData('text/plain')); }catch(err){ return; }
    if(!data || data.from===side) return;
    state.sidebarLayout[data.from]=state.sidebarLayout[data.from].filter(m=>m!==data.mid);
    if(!state.sidebarLayout[side].includes(data.mid)) state.sidebarLayout[side].push(data.mid);
    state.activeTab[side]=data.mid;
    renderSidebar('left'); renderSidebar('right');
  };

function renderFiltersModule(el){
  const scenes=getScenes();
  const shootDays=orderedShootDays();
  function group(title, items, setKey, render){
    const g=document.createElement('div'); g.className='filter-group';
    const t=document.createElement('div'); t.className='filter-title'; t.textContent=title;
    g.appendChild(t);
    if(!items.length){ const e=document.createElement('div'); e.className='module-empty'; e.style.padding='0 0 4px'; e.textContent='None yet'; g.appendChild(e); el.appendChild(g); return; }
    const row=document.createElement('div'); row.className='chip-row';
    items.forEach(item=>{
      const chip=document.createElement('button'); chip.type='button';
      chip.className='chip'+(state.filters[setKey].has(item.id)?' on':'');
      chip.innerHTML=render(item);
      chip.addEventListener('click', ()=>{
        const wasOn=state.filters[setKey].has(item.id);
        if(wasOn) state.filters[setKey].delete(item.id); else state.filters[setKey].add(item.id);
        // applyFilters() runs FIRST and does its own updateConnectors() sweep
        // (needed regardless of shot-folding, since toggling any filter --
        // shot included -- can change which notes are filtered-out). The
        // shot-fold functions run LAST: setFoldedBatch()/unfoldAllNotes()
        // already do their own single, correctly-sequenced updateConnectors()
        // call internally right before kicking off each note's connector
        // animation (see setFoldedBatch's comment) -- if applyFilters() ran
        // AFTER them instead, its own updateConnectors() call would wipe out
        // every one of those just-started animations, so connectors would
        // snap in instantly with no animation. Neither call's *decision*
        // logic depends on the other running first (applyFilters() only
        // reads state.filters, already updated above; the shot-fold
        // functions only read state.filters.shots / n.shotId), so this
        // reordering is safe.
        applyFilters();
        if(setKey==='shots'){
          // Mirrors the Shot List's own shot-focus fold behavior: with one or
          // more shot filters active, fold every note that doesn't belong to
          // any of them and unfold the ones that do (animated); with none
          // active, just unfold everything that was left folded.
          if(state.filters.shots.size>0) applyShotFilterFold();
          else unfoldAllNotes(false);
        }
        renderFiltersModule(el.parentElement? el : el);
      });
      row.appendChild(chip);
    });
    g.appendChild(row); el.appendChild(g);
  }
  el.innerHTML='';
  group('Shot', orderedShots().map(s=>({id:s.id,label:'Shot '+s.number})), 'shots', it=>escapeHtml(it.label));
  group('Scene', scenes.map(s=>({id:s.id,label:s.heading})), 'scenes', it=>escapeHtml((it.label||'').slice(0,26)));
  group('Shoot Day', shootDays.map(d=>({id:d,label:d})), 'shootDays', it=>escapeHtml(it.label));
  group('Type', [{id:'dot',label:'Dot Note'},{id:'sticky',label:'Sticky Note'}], 'kinds', it=>escapeHtml(it.label));
  group('Category', CATEGORIES.map(c=>({id:c.id,label:c.label,color:c.color})), 'categories', it=>'<span class="sw" style="background:'+it.color+'"></span>'+escapeHtml(it.label));
  const clear=document.createElement('button'); clear.className='filters-clear'; clear.textContent='Clear all filters';
  clear.addEventListener('click', ()=>{
    const hadShots=state.filters.shots.size>0;
    Object.keys(state.filters).forEach(k=>state.filters[k].clear());
    // Same ordering fix as the shot chip handler above: applyFilters() (and
    // its own updateConnectors() sweep) runs first, unfoldAllNotes() last,
    // so its batched connector animations aren't immediately wiped by a
    // second updateConnectors() call right after they start.
    applyFilters();
    if(hadShots) unfoldAllNotes(false);
    renderFiltersModule(el);
  });
  el.appendChild(clear);
}
function applyFilters(){
  const f=state.filters;
  const anyShot=f.shots.size, anyScene=f.scenes.size, anyDay=f.shootDays.size, anyKind=f.kinds.size, anyCategory=f.categories.size;
  const scenes=getScenes();
  state.notes.forEach(n=>{
    const els=noteEls[n.id]; if(!els) return;
    let ok=true;
    if(anyShot && !f.shots.has(n.shotId)) ok=false;
    if(ok && anyScene){
      const sc=scenes.find(s=>(n.anchorLineIds||[]).some(id=>s.lineIds.includes(id)));
      if(!sc || !f.scenes.has(sc.id)) ok=false;
    }
    if(ok && anyDay && !f.shootDays.has(n.shootDay)) ok=false;
    if(ok && anyKind && !f.kinds.has(n.kind)) ok=false;
    if(ok && anyCategory && !f.categories.has(n.category)) ok=false;
    els.wrap.classList.toggle('filtered-out', !ok);
    // Dots must never disappear — only the card (and, via updateConnectors, the connector)
    // hide when a note is filtered out. Sticky Notes have no dot, so they hide entirely.
    els.wrap.style.display = (!ok && n.kind==='sticky') ? 'none' : '';
  });
  updateConnectors();
}

/* =========================================================
   READ-ONLY MODE
   ---------------------------------------------------------
   Locks editing of the script and every note field while leaving the
   sidebar (Scenes/Shots/Filters/Sticky navigation) and fold/unfold fully
   active. Enforced in two layers: (1) direct UI state -- contentEditable
   toggled off, form fields disabled, so the browser itself blocks input and
   the buttons visibly grey out; (2) guards inside the actual mutation
   functions themselves (createNote, deleteNote, undo/redo, etc.) as a second
   line of defense for anything reachable via a path that isn't a simple
   disabled form control (keyboard shortcuts, context-menu items).
   ========================================================= */
function setReadOnly(on){
  readOnlyMode=on;
  content.contentEditable = (on || noteSelectMode) ? 'false' : 'true';
  document.getElementById('projectTitle').contentEditable = on ? 'false' : 'true';
  document.querySelectorAll('.note-body').forEach(b=>{ b.contentEditable = on ? 'false' : 'true'; });
  document.querySelectorAll('.note-shot-input, .note-day-input, .note-category-select').forEach(el=>{ el.disabled=on; });
  document.querySelectorAll('.note-close-btn').forEach(el=>{ el.style.display = on ? 'none' : ''; });
  document.querySelectorAll('.note-resize-handle').forEach(el=>{ el.style.display = on ? 'none' : ''; });
  ['btnBold','btnItalic','btnUnderline','btnStrike','btnDraw','btnEraser','btnSelectTool','btnAddMilestone'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.disabled=on;
  });
  updateUndoButtons(); // undo() itself is gated too, but the buttons should visibly grey out either way
  if(on && currentTool!=='none') setTool('none');
  if(on) hideContextMenu();
  document.body.classList.toggle('read-only-mode', on);
  const btn=document.getElementById('btnReadOnly');
  btn.classList.toggle('active', on);
  btn.title = on ? 'Exit Read-Only Mode' : 'Read-Only Mode';
}

let pointerDown=false, dragging=false, pStartX=0, pStartY=0, startPan=null, downTargetIsEmpty=false, downButton=0;
let currentTool='none'; // 'none' | 'pen' | 'eraser' | 'select'
let readOnlyMode=false;
let activeSession=null;  // in-progress pen SESSION: {id, anchorLineId, strokes:[]}
let currentStroke=null;  // in-progress single stroke: {points, color, width}
let selectedDrawingId=null; // drawing selected via the Select tool
let eraserDown=false; // true while a mouse/pointer button is held with the Eraser tool active
let canvasLongPressTimer=null;
function createMenuItemsAt(w){
  if(readOnlyMode) return [];
  return [
    {label:'Dot Note', icon:'dot', onClick:()=>createNote('dot', w.x, w.y)},
    {label:'Sticky Note', icon:'dot-outline', onClick:()=>createNote('sticky', w.x, w.y)},
    {sep:true},
    {label:'Paste Image', onClick:()=>pasteImageAt(w.x, w.y)}
  ];
}
/* Two-finger pinch-to-zoom / pan for touch devices (iPadOS, Android) — Pointer
   Events fire independently per finger, so this tracks whichever touch
   pointers are currently down itself and takes over once a second one joins.
   A single finger is untouched by this and continues to fall through to the
   existing pan/long-press logic below exactly as before. */
const activeTouches=new Map();
let pinchState=null;
function endTouchTracking(e){
  if(e.pointerType!=='touch') return;
  activeTouches.delete(e.pointerId);
  if(activeTouches.size<2) pinchState=null;
}
viewport.addEventListener('pointerdown', function(e){
  if(e.pointerType==='touch'){
    activeTouches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(activeTouches.size===2){
      pointerDown=false; dragging=false; viewport.classList.remove('panning');
      if(canvasLongPressTimer){ clearTimeout(canvasLongPressTimer); canvasLongPressTimer=null; }
      const pts=Array.from(activeTouches.values());
      pinchState={
        startDist: Math.max(1, Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y)),
        startZoom: zoom,
        startMid: {x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2},
        startPan: {x:pan.x, y:pan.y}
      };
      return;
    }
    if(activeTouches.size>2) return;
  }
  downButton=e.button;
  if(e.button!==0) return;
  if(currentTool==='pen'){
    const w=screenToWorld(e.clientX, e.clientY);
    if(!activeSession){
      const nearLine=nearestLineToWorldY(w.y);
      activeSession={id:uid('draw'), anchorLineId: nearLine ? nearLine.dataset.id : null, strokes:[]};
    }
    currentStroke={points:[w.x, w.y], color:currentDrawColor, width:currentDrawWidth};
    return;
  }
  if(currentTool==='select'){
    const w=screenToWorld(e.clientX, e.clientY);
    const PAD=10;
    let hit=null;
    for(let i=state.drawings.length-1;i>=0;i--){
      const dw=state.drawings[i];
      const b=drawingBBox(dw);
      if(w.x>=b.minX-PAD && w.x<=b.maxX+PAD && w.y>=b.minY-PAD && w.y<=b.maxY+PAD){ hit=dw; break; }
    }
    if(hit){
      const changed=selectedDrawingId!==hit.id;
      selectedDrawingId=hit.id;
      if(changed) renderDrawLayer();
      startDrawingBodyDrag(hit.id, e);
    } else if(selectedDrawingId){
      selectedDrawingId=null; renderDrawLayer();
    }
    return;
  }
  if(currentTool==='eraser'){ eraserDown=true; window.addEventListener('pointerup', onEraserGlobalUp); return; }
  downTargetIsEmpty = !e.target.closest('.paper-stack,#paperStack,.note-card,.dot-marker,#canvasHint');
  pointerDown=true; dragging=false; pStartX=e.clientX; pStartY=e.clientY; startPan={x:pan.x,y:pan.y};
  if(downTargetIsEmpty){
    const cx=e.clientX, cy=e.clientY;
    canvasLongPressTimer=setTimeout(()=>{
      canvasLongPressTimer=null;
      if(!dragging){
        const w=screenToWorld(cx, cy);
        showContextMenu(cx, cy, createMenuItemsAt(w));
      }
    }, 550);
  }
});
viewport.addEventListener('pointermove', function(e){
  if(e.pointerType==='touch' && activeTouches.has(e.pointerId)){
    activeTouches.set(e.pointerId, {x:e.clientX, y:e.clientY});
  }
  if(pinchState && activeTouches.size>=2){
    const pts=Array.from(activeTouches.values()).slice(0,2);
    const dist=Math.max(1, Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y));
    const mid={x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
    const newZoom=clamp(pinchState.startZoom*(dist/pinchState.startDist), 0.15, 2.5);
    const r=viewport.getBoundingClientRect();
    // Keep the pinch's starting midpoint anchored to the same world point
    // throughout the gesture: solve for the pan that keeps it under the
    // (possibly moving, since two fingers can also pan) current midpoint.
    const worldX=(pinchState.startMid.x-r.left-pinchState.startPan.x)/pinchState.startZoom;
    const worldY=(pinchState.startMid.y-r.top-pinchState.startPan.y)/pinchState.startZoom;
    pan.x=(mid.x-r.left)-worldX*newZoom;
    pan.y=(mid.y-r.top)-worldY*newZoom;
    zoom=newZoom;
    applyTransform();
    showZoomIndicator();
    return;
  }
  if(currentTool==='pen'){
    if(!currentStroke) return;
    const w=screenToWorld(e.clientX, e.clientY);
    currentStroke.points.push(w.x, w.y);
    renderLiveDrawing(currentStroke);
    return;
  }
  if(currentTool!=='none') return;
  if(!pointerDown) return;
  const dx=e.clientX-pStartX, dy=e.clientY-pStartY;
  if(!dragging && Math.hypot(dx,dy)>6) {
    dragging=true;
    if(downTargetIsEmpty) viewport.classList.add('panning');
    if(canvasLongPressTimer){ clearTimeout(canvasLongPressTimer); canvasLongPressTimer=null; }
  }
  if(dragging && downTargetIsEmpty){
    pan.x=startPan.x+dx; pan.y=startPan.y+dy;
    applyTransform();
  }
});
viewport.addEventListener('pointerup', function(e){
  endTouchTracking(e);
  if(currentTool==='pen'){
    if(currentStroke){
      const live=drawLayer.querySelector('[data-live="1"]'); if(live) live.remove();
      if(currentStroke.points.length>2 && activeSession){
        activeSession.strokes.push(currentStroke);
        appendStrokePath(activeSession.id, currentStroke);
      }
      currentStroke=null;
    }
    return;
  }
  if(currentTool!=='none') return;
  if(canvasLongPressTimer){ clearTimeout(canvasLongPressTimer); canvasLongPressTimer=null; }
  if(!pointerDown) return;
  pointerDown=false; viewport.classList.remove('panning');
  if(!dragging && downTargetIsEmpty && downButton===0){
    setHighlightedLine(null);
    clearNoteHighlight();
  }
  dragging=false;
});
viewport.addEventListener('pointercancel', function(e){
  endTouchTracking(e);
  pointerDown=false; dragging=false; viewport.classList.remove('panning');
  if(canvasLongPressTimer){ clearTimeout(canvasLongPressTimer); canvasLongPressTimer=null; }
});
viewport.addEventListener('contextmenu', function(e){
  if(currentTool==='select'){
    e.preventDefault();
    const w=screenToWorld(e.clientX, e.clientY);
    const PAD=10;
    for(let i=state.drawings.length-1;i>=0;i--){
      const dw=state.drawings[i];
      const b=drawingBBox(dw);
      if(w.x>=b.minX-PAD && w.x<=b.maxX+PAD && w.y>=b.minY-PAD && w.y<=b.maxY+PAD){
        showContextMenu(e.clientX, e.clientY, [
          {label:'Delete drawing', danger:true, onClick:()=>deleteDrawing(dw.id)}
        ]);
        return;
      }
    }
    return;
  }
  if(currentTool!=='none') { e.preventDefault(); return; }
  if(e.target.closest('.note-card,.dot-marker')) return;
  e.preventDefault();
  if(canvasLongPressTimer){ clearTimeout(canvasLongPressTimer); canvasLongPressTimer=null; }
  const w=screenToWorld(e.clientX, e.clientY);
  showContextMenu(e.clientX, e.clientY, createMenuItemsAt(w));
});
viewport.addEventListener('wheel', function(e){
  e.preventDefault();
  if(e.ctrlKey || e.metaKey){
    const r=viewport.getBoundingClientRect();
    zoomAt(e.clientX-r.left, e.clientY-r.top, zoom*(1-e.deltaY*0.0018));
  } else if(e.altKey || e.shiftKey){
    const delta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    pan.x -= delta; applyTransform();
  } else {
    pan.x-=e.deltaX; pan.y-=e.deltaY; applyTransform();
  }
}, {passive:false});

const contextMenu=document.getElementById('contextMenu');
function showContextMenu(x,y,items){
  if(!items || !items.length) return; // nothing to offer (e.g. every mutating item was filtered out in Read-Only Mode) -- don't show an empty box
  contextMenu.innerHTML='';
  items.forEach(it=>{
    if(it.sep){ const s=document.createElement('div'); s.className='cm-sep'; contextMenu.appendChild(s); return; }
    const btn=document.createElement('button'); btn.className='cm-item'+(it.danger?' danger':'')+(it.suggested?' suggested':'');
    btn.addEventListener('mousedown', e=>e.preventDefault());
    let dotHtml='';
    if(it.icon==='dot') dotHtml='<span class="cm-dot"></span>';
    if(it.icon==='dot-outline') dotHtml='<span class="cm-dot outline"></span>';
    btn.innerHTML=dotHtml+'<span>'+escapeHtml(it.label)+'</span>';
    btn.addEventListener('click', ()=>{ hideContextMenu(); it.onClick(); });

   ========================================================= */
function snapshotState(){
  return JSON.stringify({
    lines:serializeLines(),
    notes:state.notes.map(n=>({...n})),
    shots:state.shots.map(s=>({...s})),
    drawings:state.drawings.map(d=>({...d})),
    images:state.images.map(i=>({...i}))
  });
}
const scheduleSnapshot=debounce(function(){
  const snap=snapshotState();
  if(undoStack.length && undoStack[undoStack.length-1]===snap) return;
  undoStack.push(snap);
  if(undoStack.length>80) undoStack.shift();
  redoStack.length=0;
  updateUndoButtons();
}, 500);
function restoreSnapshot(snapStr){
  const data=JSON.parse(snapStr);
  initScreenplay(data.lines);
  notesLayer.innerHTML=''; Object.keys(noteEls).forEach(k=>delete noteEls[k]);
  state.notes=migrateNotes(data.notes); state.shots=data.shots; state.drawings=migrateDrawings(data.drawings||[]); state.images=data.images||[];
  state.notes.forEach(n=>createNoteDOM(n));
  refreshAllShotOptions();
  recomputePagination(); layoutAllNotes(); renderDrawLayer(); renderImagesLayer();
  renderSidebar('left'); renderSidebar('right'); renderTimeline();
}
function undo(){
  if(readOnlyMode || undoStack.length<2) return;
  redoStack.push(undoStack.pop());
  restoreSnapshot(undoStack[undoStack.length-1]);
  updateUndoButtons(); scheduleAutosave();
}
function redo(){
  if(readOnlyMode || !redoStack.length) return;
  const snap=redoStack.pop();
  undoStack.push(snap);
  restoreSnapshot(snap);
  updateUndoButtons(); scheduleAutosave();
}
function updateUndoButtons(){
  document.getElementById('btnUndo').disabled = readOnlyMode || undoStack.length<2;
  document.getElementById('btnRedo').disabled = readOnlyMode || redoStack.length===0;
}

/* =========================================================
   FIND & REPLACE
   ---------------------------------------------------------
   Word-style floating pop-ups (not a blocking modal): Find (Ctrl/Cmd+F) and
   Replace (Ctrl/Cmd+H) are mutually exclusive — opening one closes the other.
   Matches are tracked as {blockId, start, end} flattened-text spans and
   rendered via the shared text-highlight overlay (renderTextHighlights()),
   so — like the note/shot highlights — they hug the actual matched text.
   ========================================================= */
let findMatches=[], findCurrentIndex=-1, findTerm='';
function computeFindMatches(term){
  const matches=[];
  if(!term) return matches;
  const t=term.toLowerCase();
  allLineEls().forEach(b=>{
    const text=cleanBlockText(b).toLowerCase();
    let idx=text.indexOf(t);
    while(idx>=0){
      matches.push({blockId:b.dataset.id, start:idx, end:idx+term.length});
      idx=text.indexOf(t, idx+term.length);
    }
  });
  return matches;
}
function updateFindCountDisplay(){
  const label = findMatches.length ? ((findCurrentIndex+1)+' of '+findMatches.length) : (findTerm?'No results':'');
  const fc=document.getElementById('fpCount'); if(fc) fc.textContent=label;
  const rc=document.getElementById('rpCount'); if(rc) rc.textContent=label;
}
function panToMatch(m){
  const line=content.querySelector('[data-id="'+m.blockId+'"]');
  if(line) panToWorldPoint(PAGE_W/2, lineWorldTop(line));
}
function runFind(term, jumpToFirst){
  // Force pagination up to date first — Find can be invoked immediately after
  // typing, before the debounced reflow has run, and matches/positions
  // computed against stale (pre-reflow) layout would pan to the wrong place.
  recomputePagination();
  findTerm=term;
  findMatches = term ? computeFindMatches(term) : [];
  if(!findMatches.length){ findCurrentIndex=-1; }
  else if(jumpToFirst || findCurrentIndex<0 || findCurrentIndex>=findMatches.length){ findCurrentIndex=0; }
  updateFindCountDisplay();
  renderTextHighlights();
  if(findCurrentIndex>=0) panToMatch(findMatches[findCurrentIndex]);
}
function stepFind(dir){
  if(!findMatches.length) return;
  recomputePagination();
  findCurrentIndex=(findCurrentIndex+dir+findMatches.length)%findMatches.length;
  updateFindCountDisplay();
  renderTextHighlights();
  panToMatch(findMatches[findCurrentIndex]);
}
function clearFindState(){
  findMatches=[]; findCurrentIndex=-1; findTerm='';
  renderTextHighlights();
}
function closeFindPopover(){ const p=document.getElementById('findPopover'); if(p) p.remove(); }
function closeReplacePopover(){ const p=document.getElementById('replacePopover'); if(p) p.remove(); }
const CHEVRON_UP_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="13" height="13"><path d="M6 15l6-6 6 6"/></svg>';
const CHEVRON_DOWN_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="13" height="13"><path d="M6 9l6 6 6-6"/></svg>';
function openFindPopover(){
  closeReplacePopover();
  const existing=document.getElementById('findPopover');
  if(existing){ const inp=document.getElementById('fpInput'); inp.focus(); inp.select(); return; }
  const pop=document.createElement('div'); pop.id='findPopover'; pop.className='fr-popover';
  pop.innerHTML=

      '<span class="fr-count" id="fpCount"></span>'+

      '<button type="button" class="fr-icon-btn" id="fpClose" title="Close (Esc)">&times;</button>'+

  document.body.appendChild(pop);

    if(e.key==='Enter'){ e.preventDefault(); stepFind(e.shiftKey?-1:1); }
    else if(e.key==='Escape'){ e.preventDefault(); closeFindPopover(); clearFindState(); }
  });
  document.getElementById('fpPrev').addEventListener('click', ()=>stepFind(-1));
  document.getElementById('fpNext').addEventListener('click', ()=>stepFind(1));

function openReplacePopover(prefillFind){
  closeFindPopover();

  if(existing){ document.getElementById('rpFind').focus(); return; }

      '<button type="button" class="fr-icon-btn" id="rpNext" title="Next match">'+CHEVRON_DOWN_SVG+'</button>'+
      '<button type="button" class="fr-icon-btn" id="rpClose" title="Close (Esc)">&times;</button>'+
    '</div>'+

    '</div></div>';
  document.body.appendChild(pop);
  const findInput=document.getElementById('rpFind');
  findInput.addEventListener('input', ()=>runFind(findInput.value, true));
  findInput.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); stepFind(e.shiftKey?-1:1); }
    else if(e.key==='Escape'){ e.preventDefault(); closeReplacePopover(); clearFindState(); }
  });
  document.getElementById('rpPrev').addEventListener('click', ()=>stepFind(-1));
  document.getElementById('rpNext').addEventListener('click', ()=>stepFind(1));
  document.getElementById('rpClose').addEventListener('click', ()=>{ closeReplacePopover(); clearFindState(); });
  document.getElementById('rpOne').addEventListener('click', function(){
    replaceCurrentMatch(document.getElementById('rpReplace').value);
  });
  document.getElementById('rpAll').addEventListener('click', function(){
    replaceAllMatches(findInput.value, document.getElementById('rpReplace').value);
  });
  findInput.focus(); findInput.select();
  if(findInput.value) runFind(findInput.value, true);
}
/* Maps a flattened-text offset within `block` back to a concrete (textNode, offset) pair,
   so Find/Replace can surgically replace just the matched span via a Range instead of
   flattening the whole line through textContent (which would silently wipe any Bold/Italic/
   Underline/Strikethrough elsewhere on that line). */
function textOffsetToNodeOffset(block, targetOffset){
  const walker=document.createTreeWalker(block, NodeFilter.SHOW_TEXT, null);
  let acc=0, node=null, last=null;
  while((node=walker.nextNode())){
    const len=node.nodeValue.length;
    if(targetOffset<=acc+len){ return {node, offset: targetOffset-acc}; }
    acc+=len; last=node;
  }
  if(last) return {node:last, offset:last.nodeValue.length};
  return {node:block, offset:block.childNodes.length};
}
function replaceRangeInBlock(block, startOffset, endOffset, replacement){
  removeDialogueSplit(block); // ensure offsets map to the real text, not a gap-spacer sitting mid-range
  const start=textOffsetToNodeOffset(block, startOffset);
  const end=textOffsetToNodeOffset(block, endOffset);
  const r=document.createRange();
  r.setStart(start.node, start.offset);
  r.setEnd(end.node, end.offset);
  r.deleteContents();
  const textNode=document.createTextNode(replacement);
  r.insertNode(textNode);
  return textNode;
}
function replaceCurrentMatch(repl){
  if(readOnlyMode) return;
  if(!findMatches.length){ showToast('No matches found'); return; }
  if(findCurrentIndex<0) findCurrentIndex=0;
  const m=findMatches[findCurrentIndex];
  const block=content.querySelector('[data-id="'+m.blockId+'"]');
  if(!block) return;
  replaceRangeInBlock(block, m.start, m.end, repl);
  scheduleReflow(); scheduleSnapshot(); scheduleAutosave();
  // Re-run the search fresh (text shifted) and land on the next match in the same spot.
  runFind(findTerm, false);
  if(findMatches.length){ findCurrentIndex=Math.min(findCurrentIndex, findMatches.length-1); updateFindCountDisplay(); renderTextHighlights(); }
}
function replaceAllMatches(term, repl){
  if(readOnlyMode) return;
  if(!term){ return; }
  // Use the same case-insensitive matching as Find/computeFindMatches (and
  // the highlight overlay) so "Replace All" always accounts for every match
  // the user can see highlighted — no silently-skipped case-mismatched hits.
  const matches=computeFindMatches(term);
  let count=0;
  // Replace back-to-front per block so earlier offsets in the same line
  // stay valid as later-in-line matches are replaced first.
  const byBlock={};
  matches.forEach(m=>{ (byBlock[m.blockId]=byBlock[m.blockId]||[]).push(m); });
  Object.keys(byBlock).forEach(blockId=>{
    const block=content.querySelector('[data-id="'+blockId+'"]');
    if(!block) return;
    const ms=byBlock[blockId].slice().sort((a,b)=>b.start-a.start);
    ms.forEach(m=>{ replaceRangeInBlock(block, m.start, m.end, repl); count++; });
  });
  scheduleReflow(); scheduleSnapshot(); scheduleAutosave();
  showToast(count+' replacement'+(count===1?'':'s')+' made');
  runFind(term, true);
}
