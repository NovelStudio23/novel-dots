<title>Novel Dots</title>
<style>
:root{
  --canvas:#ECECEC;
  --canvas-beige:#EDE6D6;
  --chrome-bg:#FAFAFA;
  --chrome-bg-soft:#F1F1F1;
  --chrome-line:#E1E1E1;
  --chrome-line-strong:#D3D3D3;
  --text-chrome:#242424;
  --text-chrome-dim:#6B6B6B;
  --text-dim:#767676;
  --paper:#FFFFFF;
  --paper-edge:#E3E3E3;
  --ink:#242424;
  --ink-soft:#6B6B6B;
  --accent:#2B6CDE;
  --accent-bright:#3D7CF2;
  --accent-dim:#1E52AE;
  --accent-tint:#E9F1FE;
  --parchment:#E9F1FE;
  --sticky:#FFF3B0;
  --drawingbg:#F1F1EE;
  --card-border:#D6E3FB;
  --sticky-border:#EAD98C;
  --resolved:#1E9E5A;
  --danger:#C43D3D;
  --radius:3px;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --mono: 'Courier New', Courier, monospace;
}
body.theme-beige{ --canvas:var(--canvas-beige); }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--chrome-bg); color:var(--text-chrome); font-family:var(--sans);
  overflow:hidden; -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
/* ---------- TEXT SELECTION SCOPE ----------
   Only the screenplay paragraphs, note text, and the project title should be
   selectable. Everything else (toolbar/button labels, sidebar items, menus,
   dialogs, etc.) is not. */
*{ user-select:none; -webkit-user-select:none; }
#screenplayContent, #screenplayContent *, .note-body, .note-body *, #projectTitle,
input, textarea{
  user-select:text; -webkit-user-select:text;
}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

#app{position:fixed; inset:0; display:flex; flex-direction:column;}

/* ---------- TOPBAR ---------- */
#topbar{
  height:52px; flex:none; display:flex; align-items:center; gap:10px;
  padding:0 14px; background:var(--chrome-bg);
  border-bottom:1px solid var(--chrome-line); z-index:40; overflow-x:auto; overflow-y:hidden;
}
#topbar::-webkit-scrollbar{height:0;}
.element-select{
  height:30px; padding:0 8px; border-radius:6px; border:1px solid var(--chrome-line); background:var(--chrome-bg);
  color:var(--text-chrome); font-size:12.5px; min-width:128px;
}
.element-select:hover{border-color:var(--chrome-line-strong);}
.icon-btn.align-active{color:var(--accent); background:var(--accent-tint); border-color:transparent;}
#btnDraw.active, #btnEraser.active, #btnSelectTool.active{color:#fff; background:var(--accent);}
#btnPenFinish{
  display:none; position:fixed; transform:translateX(-50%);
  z-index:250; white-space:nowrap; font-size:11px; font-weight:600; padding:5px 10px; border-radius:6px;
  border:1px solid var(--accent); background:var(--accent); color:#fff; box-shadow:0 4px 10px rgba(0,0,0,.15);
}
#btnPenFinish:hover{background:var(--accent-dim);}
#btnPenFinish.show{display:block;}
#canvasViewport[data-tool="pen"]{cursor:crosshair;}
#canvasViewport[data-tool="eraser"]{cursor:crosshair;}
#canvasViewport[data-tool="select"]{cursor:default;}
#canvasViewport.tool-active #screenplayContent, #canvasViewport.tool-active #notesLayer{pointer-events:none;}
#drawLayer{position:absolute; left:0; top:0; width:1px; height:1px; overflow:visible; z-index:10;}
#drawLayer.active{pointer-events:auto;}
.drawing-path{fill:none; stroke-linecap:round; stroke-linejoin:round;}
#canvasViewport[data-tool="select"] .drawing-path{cursor:move;}
#canvasViewport[data-tool="eraser"] .drawing-path{cursor:crosshair;}
.drawing-connector{fill:none; stroke:var(--accent-dim); stroke-width:1; stroke-dasharray:3 3; opacity:.45; pointer-events:none;}
.draw-sel-rect{fill:rgba(43,108,222,.06); stroke:var(--accent); stroke-width:1; stroke-dasharray:4 3; cursor:move;}
.draw-sel-handle{fill:#fff; stroke:var(--accent); stroke-width:1.6;}
.draw-sel-handle:hover{fill:var(--accent-tint);}
.pen-popover{width:176px;}
.pen-color-row{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:2px;}
.pen-swatch{width:20px; height:20px; border-radius:50%; border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); padding:0;}
.pen-swatch.active{border-color:var(--text-chrome);}
.pen-width-row{display:flex; gap:6px;}
.pen-width-btn{flex:1; height:28px; border-radius:6px; border:1px solid var(--chrome-line); background:var(--chrome-bg); font-size:11px; color:var(--text-chrome-dim);}
.pen-width-btn:hover{border-color:var(--chrome-line-strong); color:var(--text-chrome);}
.pen-width-btn.active{background:var(--accent-tint); color:var(--accent-dim); border-color:var(--accent);}
.landing-brand{display:flex; align-items:center; gap:9px; font-family:var(--serif); font-size:19px; letter-spacing:.02em; color:var(--text-chrome); user-select:none;}
.landing-brand .brand-dot{width:9px; height:9px; border-radius:50%; background:var(--accent);}

#projectTitleWrap{display:flex; align-items:center; min-width:0;}
#projectTitle{
  font-family:var(--serif); font-size:15.5px; color:var(--text-chrome); padding:4px 8px; border-radius:5px;
  outline:none; max-width:38vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:text;
}
#projectTitle:hover{background:var(--chrome-bg-soft);}
#projectTitle:focus{background:#fff; box-shadow:0 0 0 2px var(--accent-tint), inset 0 0 0 1px var(--accent); white-space:normal; text-overflow:clip;}

.settings-popover{
  position:fixed; z-index:210; background:var(--chrome-bg); border:1px solid var(--chrome-line-strong); border-radius:10px;
  padding:14px; width:200px; box-shadow:0 14px 34px rgba(0,0,0,.18);
}
.settings-popover.hidden{display:none;}
.settings-popover .filter-title{margin-bottom:9px;}
.theme-option{display:flex; align-items:center; gap:9px; padding:7px 6px; border-radius:6px; font-size:12.5px; color:var(--text-chrome); cursor:pointer;}
.theme-option:hover{background:var(--chrome-bg-soft);}
.theme-swatch{width:18px; height:18px; border-radius:5px; border:1px solid var(--chrome-line-strong); flex:none;}
.theme-swatch.gray{background:#ECECEC;}
.theme-swatch.beige{background:#EDE6D6;}
.theme-option input{accent-color:var(--accent);}

/* ---------- LANDING PAGE ---------- */
#landingPage{position:fixed; inset:0; background:var(--chrome-bg); display:flex; flex-direction:column; z-index:5;}
#landingPage.hidden{display:none;}
.landing-topbar{height:56px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 20px; border-bottom:1px solid var(--chrome-line);}
.landing-body{flex:1; overflow-y:auto; padding:48px 40px 60px; max-width:920px; margin:0 auto; width:100%;}
.landing-new-row{margin-bottom:44px;}
.new-project-tile{
  width:150px; background:none; border:none; padding:0; display:flex; flex-direction:column; align-items:center; gap:10px;
  color:var(--text-chrome); position:relative;
}
.tile-doc{width:104px; height:130px; filter:drop-shadow(0 8px 18px rgba(0,0,0,.14)); transition:transform .15s;}
.new-project-tile:hover .tile-doc{transform:translateY(-2px);}
.tile-plus{
  position:absolute; top:44px; left:50%; transform:translateX(-50%); width:34px; height:34px; border-radius:50%;
  background:var(--accent); color:#fff; font-size:20px; line-height:34px; text-align:center; box-shadow:0 4px 10px rgba(43,108,222,.4);
}
.tile-label{font-size:13px; color:var(--text-chrome);}
.landing-projects-title{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-chrome-dim); margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--chrome-line);}
.landing-projects-list{display:flex; flex-direction:column;}
.project-row{
  display:flex; align-items:center; gap:12px; padding:11px 8px; border-radius:6px; cursor:pointer; color:var(--text-chrome);
}
.project-row:hover{background:var(--chrome-bg-soft);}
.project-row .pr-icon{width:26px; height:32px; flex:none; background:#fff; border:1px solid var(--chrome-line-strong); border-radius:2px; position:relative;}
.project-row .pr-icon::before{content:""; position:absolute; left:5px; right:5px; top:8px; height:2px; background:var(--paper-edge);}
.project-row .pr-icon::after{content:""; position:absolute; left:5px; right:9px; top:14px; height:2px; background:var(--paper-edge);}
.project-row .pr-title{flex:1; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.project-row .pr-date{font-size:11.5px; color:var(--text-chrome-dim); flex:none;}
.project-row .pr-delete{opacity:0; width:26px; height:26px; flex:none; border-radius:5px; background:none; border:none; color:var(--text-chrome-dim); display:flex; align-items:center; justify-content:center;}

/* Word-style floating zoom-level badge: bottom-right of the window when the

/* ---------- CANVAS ---------- */
#canvasViewport{flex:1; position:relative; overflow:hidden; background:var(--canvas); cursor:default; touch-action:none; -webkit-tap-highlight-color:transparent;}
#canvasViewport.panning{cursor:grabbing;}

#world.animated{transition:transform .5s cubic-bezier(.22,.85,.32,1);}

#connectorLayer{position:absolute; left:0; top:0; width:1px; height:1px; overflow:visible; pointer-events:none; z-index:6;}
.connector-path{fill:none; stroke:var(--accent-dim); stroke-width:1.1; opacity:.55; transition:opacity .25s;}
.connector-extra{stroke-dasharray:3 3; opacity:.45;}
.line-block.connect-pending{outline:2px dashed var(--accent); outline-offset:2px; background:var(--accent-tint);}
#connectFloatBtn{
  position:fixed; transform:translateX(-50%); z-index:60; font-size:11.5px; font-weight:600;
  padding:6px 14px; border-radius:16px; border:1px solid var(--accent); background:var(--accent); color:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.2); cursor:pointer;
}
#connectFloatBtn:hover{background:var(--accent-dim);}
.connector-path.connector-emphasized{opacity:1; stroke:var(--accent);}

#paperStack{position:absolute; left:0; top:0; width:816px; min-height:1056px;}
#pageDecor{position:absolute; left:0; top:0; width:816px; height:1px; pointer-events:none; z-index:1;}
/* Sits above the page background but below the script text itself, so these
   rects read as a highlighter mark behind the glyphs rather than a block
   painted over the whole line. Rects are computed from Range.getClientRects()
   (see renderTextHighlights()), so they hug the actual rendered text — one
   rect per wrapped visual line — instead of the paragraph's full box. */
#highlightLayer{position:absolute; left:0; top:0; width:816px; height:1px; pointer-events:none; z-index:1;}
/* Sits ABOVE #screenplayContent (z-index 2) but is a sibling of it, not a
   descendant -- see the dlg-gap-spacer comment above for why that matters. */
#dialogueLabelsLayer{position:absolute; left:0; top:0; width:816px; height:1px; pointer-events:none; z-index:3;}
.text-highlight{position:absolute; pointer-events:none; border-radius:2px;}
.text-highlight.hover{background:rgba(43,108,222,.08);}
.text-highlight.shot{background:rgba(43,108,222,.16);}
.text-highlight.note{background:rgba(43,108,222,.16);}
.text-highlight.both{background:rgba(43,108,222,.28);}
.text-highlight.find{background:rgba(255,196,10,.4);}
.text-highlight.find-current{background:rgba(255,149,0,.65); box-shadow:0 0 0 1px rgba(214,110,0,.55);}
/* Text Selection Highlight -- the highlight painted while dragging/shift-
   selecting text in the script. Deliberately a SEPARATE layer/system from
   #highlightLayer above (the Range Highlight, for cursor/note/shot/find) --
   see renderTextSelectionHighlight() for why native browser selection
   painting can't be used directly here. Sits in the same position as
   #highlightLayer (behind the glyphs, above the page); not rounded, since a
   real text selection reads as sharp, flush blocks, not soft highlighter
   marks. */
#textSelectionLayer{position:absolute; left:0; top:0; width:816px; height:1px; pointer-events:none; z-index:1;}
.text-sel-highlight{position:absolute; pointer-events:none; background:rgba(43,108,222,.30);}
/* The browser's own native selection painting is replaced by
   #textSelectionLayer above -- for a Range that fully spans a whole
   .line-block (a common case once a drag crosses more than one paragraph),
   native getClientRects()/selection painting falls back to that block's
   entire layout box (full column width and its own padding-top gap)
   instead of the actual glyphs, which is exactly the "covers empty space"
   look this replaces. background:transparent here only removes the paint;
   color:inherit keeps the glyphs themselves at their normal ink color
   (the default UA stylesheet's color:HighlightText would otherwise render
   them white, invisible against the transparent background). */
#screenplayContent::selection, #screenplayContent *::selection{ background:transparent; color:inherit; }
#screenplayContent::-moz-selection, #screenplayContent *::-moz-selection{ background:transparent; color:inherit; }
.page-sheet{
  position:absolute; left:0; width:816px; height:1056px; background:var(--paper);
  box-shadow:0 14px 34px rgba(0,0,0,.16), 0 2px 0 rgba(0,0,0,.05), inset 0 0 0 1px var(--paper-edge);
  transition:filter .3s;
}
/* Continuous Page View: one unbroken paper strip for the whole document
   instead of N separate PAGE_H-tall sheets with gaps between them -- height
   is set inline per-render to the document's actual total content height. */
.page-sheet-continuous{ height:auto; }
.page-number{position:absolute; right:96px; font-family:var(--mono); font-size:12pt; color:var(--ink-soft);}
/* Continuous Page View only: the label is now level with real script text
   (see renderPageDecorContinuous) rather than sitting in the empty gap
   between two discrete pages, so it needs to clear the text column's own
   right edge -- moved right, into the open margin outside the text. */
.page-number-continuous{right:48px;}

#screenplayContent{
  position:relative; z-index:2; width:816px; padding:96px 96px 120px 144px;
  font-family:var(--mono); font-size:12pt; line-height:16px; color:var(--ink);
  outline:none; caret-color:var(--accent-dim); cursor:text;
  /* A touch heavier than the plain monospace default without looking bold —
     a hairline stroke on each glyph, well short of the real font-weight:700
     used for actual Bold text. */
  -webkit-text-stroke:.35px currentColor;
  text-stroke:.35px currentColor;
}
/* Once a text selection is actually made (not while still being dragged —
   see isPointerDownInContent), swap the I-beam for a plain arrow so the user
   can more precisely aim a right-click/long-press at an exact spot to create
   a note without the I-beam's usual visual clutter. Higher specificity than
   the base #screenplayContent rule above (one extra class), so no !important
   needed. */
#screenplayContent.has-active-selection, #screenplayContent.has-active-selection *{
  cursor:default;
}

.line-block{position:relative; padding-top:16px; white-space:pre-wrap; word-wrap:break-word; min-height:16px;}
/* Prevents the Title Page's title/author lines from changing height when the
   placeholder disappears (on focus, before any typing) and reappears (on
   blur while still empty) — without this, the line has no content at all for
   a moment (no placeholder, no typed text yet) and its box collapses, then
   pops back, causing a visible layout jump. Reserves a full line's height
   (padding-top + line-height) unconditionally so it never needs to move. */
.line-block[data-title-role]{min-height:32px;}
.line-block:first-child{padding-top:0;}
.line-block::before{
  content:attr(data-label); position:absolute; left:-118px; top:16px; width:100px; text-align:right;
  font-family:var(--sans); font-size:9px; letter-spacing:.05em; text-transform:uppercase; color:var(--accent-dim);
  opacity:0; transition:opacity .15s; pointer-events:none;
}
.line-block:first-child::before{top:0;}
.line-block:hover::before, .line-block:focus-within::before{opacity:.85;}
.type-scene_heading{text-transform:uppercase; font-weight:bold;}
.type-action{}
.type-character{margin-left:211px; text-transform:uppercase; padding-top:16px;}
.type-dialogue{margin-left:96px; width:336px; padding-top:0;}
.type-parenthetical{margin-left:154px; width:192px; padding-top:0; font-style:italic; color:var(--ink-soft);}
.type-transition{text-align:right; text-transform:uppercase;}
.type-shot{text-transform:uppercase;}
.type-centered{text-align:center;}
/* Final Draft-style dialogue continuation: a non-editable break injected
   inside a Dialogue block's own flow when its text would otherwise cross a
   page boundary — never part of the block's real text (see cleanBlockText/
   cleanBlockHTML), purely a visual "(MORE)" / margin-gap / "CHARACTER
   (CONT'D)" marker that gets recomputed on every pagination pass. The
   gap-spacer below is the only piece actually inserted into the editable
   dialogue text (an empty, invisible flow-spacer -- see buildDialogueGapSpacer);
   the "(MORE)"/"CONT'D" text itself lives entirely in #dialogueLabelsLayer,
   a sibling of #screenplayContent rather than a descendant of it, which is
   what makes it structurally impossible to ever include in a copy/paste of
   script text.
   display:block (not inline-block) is deliberate and load-bearing: a
   block-level element, even mid-way through inline text content, always
   starts on its own line and pushes whatever comes after it down onto a
   fresh line below -- which is exactly the "reserve a tall gap, then
   resume text below it" effect this needs. inline-block does NOT reliably
   give that: with the default vertical-align:baseline, a very tall
   inline-block's *bottom* aligns to the surrounding text's baseline (so it
   grows upward, not downward) and the text right after it on the same line
   renders at that same baseline -- not pushed down at all; even
   vertical-align:top, which does make the *line* tall, still leaves
   same-line follow-on text sitting at the line's normal baseline position
   near its top, not its bottom. Both were tried and produced the exact
   "Character name renders overlapping the continuation text" bug this
   replaced. */
.dlg-gap-spacer{display:block; width:0; -webkit-user-select:none; user-select:none;}
/* Same hairline stroke as #screenplayContent's own text (see its comment) --
   these labels live in #dialogueLabelsLayer, a sibling of #screenplayContent
   rather than a descendant, so they never inherited it and rendered
   visibly thinner than every other line of the script despite being the
   same ink color. */
.dlg-more-label-overlay, .dlg-contd-label-overlay{position:absolute; font-family:var(--mono); font-size:12pt; color:var(--ink); -webkit-text-stroke:.35px currentColor; text-stroke:.35px currentColor;}
.dlg-more-label-overlay{height:16px; line-height:16px; left:240px; width:336px; text-align:center; text-transform:uppercase; color:var(--ink);}
/* No padding-top: CHARACTER (CONT'D) is always the very first thing on its
   page, so unlike a real Character cue (padding-top:16px, for the normal
   gap above it when something else precedes it on the same page) it has
   nothing above it to space away from -- it should sit flush at the page's
   own top margin, matching Final Draft. See CONTD_LABEL_H, which this
   height must stay equal to. */
.dlg-contd-label-overlay{height:16px; line-height:16px; left:355px; text-transform:uppercase;}
.line-block[data-title-role="title"]{text-transform:uppercase;}
/* Fully reset every property the type-label ::before rule above sets — both
   rules target the same pseudo-element, and without this the placeholder
   would inherit the label's off-canvas gutter position (left:-118px) and
   opacity:0, rendering it invisible instead of inline where typed text goes. */
.line-block[data-title-role].ph-empty::before{
  content:attr(data-ph); position:static; left:auto; top:auto; width:auto; text-align:inherit;
  font-family:inherit; font-size:inherit; letter-spacing:normal;
  color:#9a9a9a; text-transform:none; opacity:1; pointer-events:none;
}
.line-block[data-align="left"]{text-align:left !important;}
.line-block[data-align="center"]{text-align:center !important;}
.line-block[data-align="right"]{text-align:right !important;}
.line-block b, .line-block strong{font-weight:700;}
.line-block i, .line-block em{font-style:italic;}
.line-block u{text-decoration-line:underline;}
.line-block strike, .line-block s{text-decoration-line:line-through;}
.note-body b, .note-body strong{font-weight:700;}
.note-body i, .note-body em{font-style:italic;}
.note-body u{text-decoration-line:underline;}
.note-body strike, .note-body s{text-decoration-line:line-through;}
.type-lyrics{margin-left:96px; width:336px; font-style:italic;}
.type-general{}
.type-note{
  background:rgba(43,108,222,.14); border-left:3px solid var(--accent-dim); padding:6px 10px 6px 10px !important;
  font-style:italic; color:var(--ink-soft); border-radius:0 4px 4px 0; font-size:10.5pt;
}
.type-note::after{content:"internal — won't print"; position:absolute; right:8px; top:6px; font-family:var(--sans); font-style:normal; font-size:8.5px; color:var(--accent-dim); text-transform:uppercase; letter-spacing:.04em;}
.page-spacer{pointer-events:none;}
/* ---------- FIND & REPLACE POP-UPS ---------- */
.fr-popover{
  position:fixed; top:60px; right:20px; z-index:220; background:var(--chrome-bg); border:1px solid var(--chrome-line-strong);
  border-radius:10px; box-shadow:0 14px 34px rgba(0,0,0,.18); padding:10px; width:300px;
}
.fr-row{display:flex; align-items:center; gap:6px; margin-bottom:7px;}
.fr-row:last-child{margin-bottom:0;}
.fr-row input[type=text]{
  flex:1; height:30px; padding:0 8px; border-radius:6px; border:1px solid var(--chrome-line);
  font-size:12.5px; background:#fff; color:var(--text-chrome); min-width:0;
}
.fr-row input[type=text]:focus{border-color:var(--accent);}
.fr-count{font-size:11px; color:var(--text-chrome-dim); white-space:nowrap; min-width:52px; text-align:right;}
.fr-icon-btn{
  flex:none; width:26px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:5px;
  border:1px solid transparent; background:none; color:var(--text-chrome-dim);
}
.fr-icon-btn:hover{background:var(--chrome-bg-soft); color:var(--text-chrome);}
.fr-actions{display:flex; justify-content:space-between; align-items:center;}
.fr-link-btn{background:none; border:none; color:var(--accent); font-size:12px; padding:2px 4px; margin-left:auto;}
.fr-link-btn:hover{text-decoration:underline;}
.fr-btn{padding:6px 12px; border-radius:6px; font-size:12px; border:1px solid var(--chrome-line-strong); background:transparent; color:var(--text-chrome);}
.fr-btn:hover{background:var(--chrome-bg-soft);}
.fr-btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
.fr-btn.primary:hover{background:var(--accent-dim);}

/* ---------- NOTES ---------- */
#notesLayer{position:absolute; left:0; top:0; width:1px; height:1px; z-index:15;}
/* Pasted images: decorative canvas objects, same tier conceptually as
   drawings but layered above them (z-index 12, between drawLayer's 10 and
   notesLayer's 15) -- notes stay the topmost layer per the existing hard
   rule regardless. */
#imagesLayer{position:absolute; left:0; top:0; width:1px; height:1px; z-index:12;}
.pasted-image-wrap{position:absolute; box-sizing:border-box;}
.pasted-image-wrap img{display:block; width:100%; height:100%; object-fit:contain; border-radius:4px; box-shadow:0 6px 18px rgba(0,0,0,.18);}
.pasted-image-wrap.dragging img{opacity:.85;}
.pasted-image-wrap .note-resize-handle{opacity:0;}
.pasted-image-wrap:hover .note-resize-handle{opacity:.5;}
.note-wrap{position:absolute; left:0; top:0; perspective:900px;}
.dot-marker{
  position:absolute; left:0; top:0; width:11px; height:11px; border-radius:50%; transform:translate(-50%,-50%);
  background:var(--accent); box-shadow:0 0 0 3px rgba(43,108,222,.16); cursor:pointer; z-index:2;
  transition:box-shadow .15s, transform .15s;
}
.dot-marker:hover{box-shadow:0 0 0 5px rgba(43,108,222,.28); transform:translate(-50%,-50%) scale(1.15);}
.note-wrap[data-kind="sticky"] .dot-marker{display:none;}
.note-wrap.note-free .dot-marker{display:none;}
.note-wrap.filtered-out .note-card{display:none !important;}

.note-card{
  position:absolute; top:0; width:264px; background:var(--parchment); border:1px solid var(--card-border);
  border-radius:5px; box-shadow:0 10px 24px rgba(0,0,0,.16); transform:scale(.1) rotate(-9deg); opacity:0; pointer-events:none;
  transform-origin:0% 50%; transition:transform .34s cubic-bezier(.34,1.56,.64,1), opacity .2s ease; z-index:3;
  font-family:var(--sans); color:var(--ink); display:flex; flex-direction:column;
}
.note-card>.note-head, .note-card>.note-foot, .note-card>.note-chip-label, .note-card>.note-canvas-wrap{flex:none;}
.note-resize-handle{position:absolute; bottom:0; width:14px; height:14px; z-index:6; opacity:0; transition:opacity .15s;}
.note-card:hover .note-resize-handle{opacity:.5;}
.note-resize-bl{left:0; cursor:sw-resize; background:linear-gradient(135deg, transparent 50%, var(--ink-soft) 50%); border-bottom-left-radius:5px;}
.note-resize-br{right:0; cursor:se-resize; background:linear-gradient(315deg, transparent 50%, var(--ink-soft) 50%); border-bottom-right-radius:5px;}
.note-wrap[data-side="left"] .note-card{transform-origin:100% 50%;}
.note-wrap.is-open .note-card{transform:scale(1) rotate(0deg); opacity:1; pointer-events:auto;}
.note-wrap[data-kind="sticky"] .note-card{
  border-radius:1px; width:190px; min-height:190px;
  transform:scale(1) rotate(0deg) !important; opacity:1 !important; pointer-events:auto !important;
  box-shadow:0 8px 18px rgba(0,0,0,.24), 0 1px 0 rgba(0,0,0,.05);
}
.note-wrap[data-kind="sticky"] .note-head{cursor:grab;}
.note-head{display:flex; align-items:center; gap:6px; padding:7px 8px; border-bottom:1px solid rgba(0,0,0,.08); cursor:grab;}
/* While any note (dot, card, or sticky) is actively being dragged, lock the
   cursor to a closed/"grabbing" hand everywhere on screen — not just over the
   handle — matching how native drag interactions behave. */
body.note-dragging, body.note-dragging *{cursor:grabbing !important;}
.note-head .kind-tag{font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);}
.note-category-select{
  margin-left:auto; font-size:10px; border:none; background:rgba(0,0,0,.06); border-radius:10px; padding:2px 6px;
  color:var(--ink); appearance:none;
}
.note-close-btn{width:18px; height:18px; display:flex; align-items:center; justify-content:center; background:none; border:none; color:var(--ink-soft); border-radius:4px;}
.note-close-btn:hover{background:rgba(0,0,0,.08); color:var(--ink);}
.note-body{
  padding:8px 9px; min-height:44px; font-size:16px; line-height:1.35; outline:none; white-space:pre-wrap;
  word-wrap:break-word; cursor:text; flex:1 1 auto; overflow:auto;
}
.note-body:empty::before{content:attr(data-placeholder); color:var(--ink-soft); opacity:.6;}
.note-canvas-wrap{padding:8px;}
.note-canvas-wrap canvas{width:100%; height:110px; background:#fff; border-radius:3px; border:1px solid rgba(0,0,0,.1); touch-action:none; cursor:crosshair;}
.note-canvas-tools{display:flex; justify-content:flex-end; margin-top:4px;}
.note-canvas-tools button{font-size:9.5px; background:none; border:none; color:var(--ink-soft); text-decoration:underline; padding:0;}
.note-foot{display:flex; flex-wrap:wrap; gap:5px; padding:6px 8px 8px; border-top:1px solid rgba(0,0,0,.06);}
.note-foot select, .note-foot input{
  font-size:10px; border:1px solid rgba(0,0,0,.12); background:rgba(255,255,255,.5); border-radius:4px; padding:2px 5px;
  color:var(--ink); max-width:100px;
}
.note-chip-label{display:none; font-size:11px; padding:4px 9px; white-space:nowrap; max-width:150px; overflow:hidden; text-overflow:ellipsis;}



/* Shot-select marks its lines with .shot-highlight purely so the fade rule
   below can exclude them — the highlight color itself is painted by the tight,
   text-hugging #highlightLayer overlay (see renderTextHighlights()), not by a
   full-row background here. */
#screenplayContent.shot-focus .line-block:not(.shot-highlight){opacity:.28;}

/* ---------- context menu / modal / toast ---------- */
.context-menu{
  position:fixed; z-index:310; background:var(--chrome-bg); border:1px solid var(--chrome-line-strong);
  border-radius:8px; padding:5px; min-width:190px; box-shadow:0 14px 34px rgba(0,0,0,.18);
}
.context-menu.hidden{display:none;}
.cm-item{
  display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:5px; font-size:12.5px; color:var(--text-chrome);
  background:none; border:none; width:100%; text-align:left;
}
.cm-item:hover{background:var(--chrome-bg-soft); color:var(--accent-bright);}
.cm-item.suggested{background:rgba(43,108,222,.14); color:var(--accent); font-weight:600;}
.cm-item.suggested:hover{background:rgba(43,108,222,.24); color:var(--accent-bright);}
.cm-item .cm-dot{width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none;}
.cm-item .cm-dot.outline{background:transparent; border:1.5px solid var(--accent);}
.cm-sep{height:1px; background:var(--chrome-line); margin:5px 2px;}
.cm-item.danger:hover{color:var(--danger);}

.modal-overlay{position:fixed; inset:0; z-index:300; background:rgba(10,9,7,.6); display:flex; align-items:center; justify-content:center;}
.modal-overlay.hidden{display:none;}
.modal-box{
  width:min(440px,92vw); background:var(--chrome-bg); border:1px solid var(--chrome-line-strong); border-radius:10px;
  padding:20px; box-shadow:0 20px 50px rgba(0,0,0,.22);
}
.modal-title{font-family:var(--serif); font-size:16px; margin:0 0 12px;}
.modal-box input[type=text], .modal-box textarea{
  width:100%; background:var(--canvas); border:1px solid var(--chrome-line-strong); color:var(--text-chrome);
  border-radius:6px; padding:9px 10px; font-size:13px; margin-bottom:10px;
}
.modal-box textarea{resize:vertical; min-height:200px; font-family:var(--mono); font-size:11.5px; line-height:1.5;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:6px;}
.modal-btn{padding:8px 14px; border-radius:6px; font-size:12.5px; border:1px solid var(--chrome-line-strong); background:transparent; color:var(--text-chrome);}
.modal-btn:hover{border-color:var(--chrome-line-strong); background:var(--chrome-bg-soft);}
.modal-btn.primary{background:var(--accent); border-color:var(--accent); color:#231D10; font-weight:600;}
.modal-btn.primary:hover{background:var(--accent-bright);}
.modal-p{font-size:13px; color:var(--text-chrome-dim); line-height:1.5; margin:0 0 14px;}
.modal-row{display:flex; gap:8px;}
.modal-row input{flex:1;}

.toast{position:fixed; left:50%; bottom:86px; transform:translateX(-50%) translateY(10px); z-index:400; background:var(--chrome-bg); border:1px solid var(--chrome-line-strong); color:var(--text-chrome); padding:9px 16px; border-radius:20px; font-size:12.5px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; box-shadow:0 8px 22px rgba(0,0,0,.18);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

#canvasHint{
  position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:20; background:rgba(255,255,255,.92);
  border:1px solid var(--chrome-line-strong); color:var(--text-chrome-dim); font-size:11.5px; padding:7px 12px;
  border-radius:20px; display:flex; align-items:center; gap:10px; backdrop-filter:blur(6px); box-shadow:0 6px 18px rgba(0,0,0,.08);
}
#canvasHint button{background:none; border:none; color:var(--text-chrome-dim); font-size:14px; line-height:1; padding:0;}
#canvasHint button:hover{color:var(--text-chrome);}
#canvasHint.hidden{display:none;}

/* ---------- TIMELINE ---------- */
#timeline{
  height:56px; flex:none; background:var(--chrome-bg); border-top:1px solid var(--chrome-line);
  display:flex; align-items:center; padding:0 16px; gap:14px; position:relative; z-index:25; transition:margin .22s ease, opacity .22s ease;
}
#timeline.hidden-panel{margin-bottom:-56px; opacity:0; pointer-events:none;}
.tl-label{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-chrome-dim); flex:none;}
#tlTrack{flex:1; position:relative; height:2px; background:var(--chrome-line-strong); border-radius:2px; margin:0 8px;}
.tl-milestone{
  position:absolute; top:50%; width:11px; height:11px; transform:translate(-50%,-50%) rotate(45deg); background:var(--accent);
  border:2px solid var(--chrome-bg); cursor:pointer; box-shadow:0 0 0 1px var(--accent-dim);
}
.tl-milestone:hover{background:var(--accent-bright);}
.tl-milestone .tl-tip{
  position:absolute; bottom:16px; left:50%; transform:translateX(-50%) rotate(-45deg); background:var(--canvas); color:var(--text-chrome);
  font-size:10.5px; padding:5px 8px; border-radius:5px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s;
  border:1px solid var(--chrome-line-strong);
}
.tl-milestone:hover .tl-tip{opacity:1;}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .sidebar{position:absolute; top:0; bottom:0; height:100%;}
  #leftSidebar{left:0;} #rightSidebar{right:0;}
  .sidebar.hidden-panel{margin:0;}
  #leftSidebar.hidden-panel{transform:translateX(-100%);}
  #rightSidebar.hidden-panel{transform:translateX(100%);}
  #projectTitle{max-width:32vw;}
}
.hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="tb-group">
      <button class="icon-btn" id="btnHome" title="My Projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
      </button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="text-btn" id="btnFileMenu">File</button>
      <button class="text-btn" id="btnAddMilestone">+ Milestone</button>
    </div>
    <div class="tb-sep"></div>
    <div id="projectTitleWrap" title="Click to rename">
      <span id="projectTitle" contenteditable="true" spellcheck="false"></span>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button type="button" class="element-select element-select-btn" id="elementTypeBtn" title="Element type">
        <span id="elementTypeBtnLabel">Action</span>
        <svg class="et-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="icon-btn fmt-btn" id="btnBold" title="Bold (Ctrl/Cmd+B)"><b>B</b></button>
      <button class="icon-btn fmt-btn" id="btnItalic" title="Italic (Ctrl/Cmd+I)"><i>I</i></button>
      <button class="icon-btn fmt-btn" id="btnUnderline" title="Underline (Ctrl/Cmd+U)"><u>U</u></button>
      <button class="icon-btn fmt-btn" id="btnStrike" title="Strikethrough"><s>S</s></button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <span id="penBtnWrap" style="position:relative; display:inline-flex;">
        <button class="icon-btn" id="btnDraw" title="Pen (click again for color/thickness, right-click for options)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        <button id="btnPenFinish" title="Finish drawing">Finish</button>
      </span>
      <button class="icon-btn" id="btnEraser" title="Eraser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="11" width="14" height="8" rx="1.5" transform="rotate(-35 10 15)"/><path d="M8 21h13"/></svg></button>
      <button class="icon-btn" id="btnSelectTool" title="Select drawings"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M5 3l14 8-6 1.5L11 19z"/></svg></button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="icon-btn" id="btnFoldAll" title="Fold All Notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9h16"/><path d="M4 15h16"/><path d="M9 4 12 7 15 4"/><path d="M9 20 12 17 15 20"/></svg></button>
      <button class="icon-btn" id="btnUnfoldAll" title="Unfold All Notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9h16"/><path d="M4 15h16"/><path d="M9 6 12 3 15 6"/><path d="M9 18 12 21 15 18"/></svg></button>
      <button class="icon-btn" id="btnHideAll" title="Hide All"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="21" x2="21" y2="3"/></svg></button>
      <button class="icon-btn" id="btnReadOnly" title="Read-Only Mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></button>
      <button class="icon-btn" id="btnNoteSelect" title="Select multiple notes (Ctrl/Cmd+J)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m7.5 12 3 3 6-6"/></svg></button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="icon-btn" id="btnUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 7 4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-1"/></svg></button>
      <button class="icon-btn" id="btnRedo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m15 7 5 5-5 5"/><path d="M20 12H9A5 5 0 0 0 9 22h1"/></svg></button>
      <button class="icon-btn" id="btnFind" title="Find &amp; Replace (Ctrl/Cmd+F, Ctrl/Cmd+H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg></button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button class="icon-btn" id="btnContinuousView" title="Continuous Page View">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="2" width="14" height="7" rx="1"/><rect x="5" y="15" width="14" height="7" rx="1"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="icon-btn" id="btnToggleTimeline" title="Toggle Living Script timeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="16" x2="21" y2="16"/></svg>

function hexToRgbArr(hex){ const h=hex.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

/* =========================================================

const SAMPLE_LINES=[

/* =========================================================
   STATE
   ========================================================= */
const state={
  projectId:null, projectTitle:'Untitled Screenplay',
  notes:[], shots:[], milestones:[], drawings:[], images:[],
  filters:{shots:new Set(), scenes:new Set(), shootDays:new Set(), kinds:new Set(), categories:new Set()},
  activeShotId:null,
  sidebarLayout:{left:['scenes'], right:['shots','filters','sticky']},
  activeTab:{left:'scenes', right:'shots'},
  panelsVisible:{left:true, right:true, timeline:false},
  showHiddenMilestones:false
};
let pan={x:0,y:0}, zoom=1;
window.__ndDebug={ getPan:()=>({...pan}), getZoom:()=>zoom, getState:()=>state };
let currentDrawColor='#2B6CDE';
let currentDrawWidth=2.5;
const DRAW_COLORS=['#2B6CDE','#242424','#D64545','#2E9E4F','#E07A3F','#8E44AD','#B8860B'];
const DRAW_WIDTHS=[{label:'Thin', v:1.5},{label:'Medium', v:2.5},{label:'Thick', v:4.5}];
let undoStack=[], redoStack=[];
const noteEls={};
let findState={term:'', idx:-1};

const content=document.getElementById('screenplayContent');
const world=document.getElementById('world');
const viewport=document.getElementById('canvasViewport');
const notesLayer=document.getElementById('notesLayer');
const connectorLayer=document.getElementById('connectorLayer');
const pageDecor=document.getElementById('pageDecor');
const dialogueLabelsLayer=document.getElementById('dialogueLabelsLayer');
const textSelectionLayer=document.getElementById('textSelectionLayer');

/* Camera/"pan" position is managed entirely through pan.x/pan.y + the CSS
   transform on #world — never through native scrolling. But #screenplayContent
   is contenteditable, and the browser's own native "scroll the caret into
   view" behavior can still set #canvasViewport's scrollTop/scrollLeft
   directly (overflow:hidden blocks user-driven wheel/gesture scroll and hides
   the scrollbar, but does not stop the browser from programmatically
   scrolling it, e.g. when typing moves the caret outside the current pan
   window). If that ever happens it silently desyncs every world<->screen
   coordinate conversion (lineWorldTop, connectors, dots, Find's pan-to-match,
   etc.) from what's actually on screen. Immediately stamp any such native
   scroll back to zero so the app's own pan/zoom stays the single source of
   truth for camera position. */
viewport.addEventListener('scroll', function(){
  if(viewport.scrollTop!==0 || viewport.scrollLeft!==0){ viewport.scrollTop=0; viewport.scrollLeft=0; }
});

/* =========================================================
   SCREENPLAY EDITOR
   ========================================================= */
function createLineElement(l){
  const div=document.createElement('div');
  div.className='line-block type-'+l.type;
  div.dataset.id=l.id||uid('ln');
  div.dataset.type=l.type;
  div.dataset.label=TYPE_LABELS[l.type];
  if(l.align){ div.dataset.align=l.align; }
  if(l.forceBreakAfter){ div.dataset.forceBreak='1'; }
  if(l.titleRole){ div.dataset.titleRole=l.titleRole; }
  // l.html (when present) preserves character-level Bold/Italic/Underline/Strikethrough.
  // Lines that only ever had plain text (fresh lines, .txt/.docx/.pdf import) fall back to
  // escaped plain text — never raw, since we're now assigning through innerHTML.
  div.innerHTML = (l.html!==undefined && l.html!==null) ? l.html : escapeHtml(l.text||'');
  return div;
}
function initScreenplay(lines){
  content.innerHTML='';
  lines.forEach(l=>content.appendChild(createLineElement(l)));
  if(!content.children.length){ content.appendChild(createLineElement({type:'scene_heading', text:''})); }
  _lastPaginationSig=null;
  _forcePaginationRebuild=false;
  updateTitlePagePlaceholders();
}
/* The Title Page's title/author lines show gray placeholder text ("SCREENPLAY
   TITLE" / "Author Name") whenever empty, and it disappears the instant
   the field is focused OR typing starts — not just on typing — and reappears
   if the line is blurred (or emptied back out) while still empty. */
function updateTitlePagePlaceholders(){
  content.querySelectorAll('.line-block[data-title-role]').forEach(el=>{
    const empty = el.textContent.trim()==='';
    el.classList.toggle('ph-empty', empty);
    if(empty){ el.dataset.ph = el.dataset.titleRole==='title' ? 'SCREENPLAY TITLE' : 'Author Name'; }
  });
}
function serializeLines(){
  return Array.from(content.querySelectorAll('.line-block')).map(el=>({
    id:el.dataset.id, type:el.dataset.type, text:cleanBlockText(el), html:cleanBlockHTML(el), align:el.dataset.align||null,
    forceBreakAfter: el.dataset.forceBreak==='1' || undefined,
    titleRole: el.dataset.titleRole || undefined
  }));
}
/* Pagination can inject a purely-visual "(MORE)/CHARACTER (CONT'D)" break
   (see computeDialogueSplitOffset/applyDialogueSplit) as a non-editable CHILD
   of a Dialogue block so the real text visually continues past a page
   boundary. That element is never part of the actual line data — anything
   that reads a block's text/HTML for real (saving, undo/redo snapshots,
   Find/Replace, shot-number heuristics) must use these instead of raw
   el.textContent/el.innerHTML, or it would leak "(MORE)"/"(CONT'D)" into the
   saved script text. Cheap no-op (returns the raw value) when no split is
   present, which is the common case. */
function cleanBlockText(block){
  if(!block.querySelector('.dlg-gap-spacer')) return block.textContent;
  const clone=block.cloneNode(true);
  clone.querySelectorAll('.dlg-gap-spacer').forEach(n=>n.remove());
  return clone.textContent;
}
function cleanBlockHTML(block){
  if(!block.querySelector('.dlg-gap-spacer')) return block.innerHTML;
  const clone=block.cloneNode(true);
  clone.querySelectorAll('.dlg-gap-spacer').forEach(n=>n.remove());
  return clone.innerHTML;
}
function getCurrentBlock(sel){
  let node=sel && sel.focusNode;
  while(node && node!==content){
    if(node.nodeType===1 && node.classList && node.classList.contains('line-block')) return node;
    node=node.parentNode;
  }
  return null;
}
function isCaretAtStart(block, range){
  const r=document.createRange();
  r.selectNodeContents(block);
  r.setEnd(range.startContainer, range.startOffset);
  return r.toString().length===0;
}
function isCaretAtEnd(block, range){
  const r=document.createRange();
  r.selectNodeContents(block);
  r.setStart(range.endContainer, range.endOffset);
  return r.toString().length===0;
}
function flatOffsetInBlock(block, container, offset){
  const r=document.createRange();
  r.selectNodeContents(block);
  r.setEnd(container, offset);
  return r.toString().length;
}
/* Keeps the caret (and any selection) strictly inside a Parenthetical's own
   "(...)" — it must never land before the opening paren or after the closing
   one, whether via arrow keys, Home/End, or a mouse click. Reactive (runs on
   every selectionchange) rather than intercepting each individual input, so
   it robustly covers every way the caret could move. */
function clampParentheticalCaret(){
  const sel=window.getSelection();
  if(!sel || !sel.rangeCount) return;
  const range=sel.getRangeAt(0);
  const anchorNode=range.startContainer;
  const anchorEl = anchorNode.nodeType===3 ? anchorNode.parentElement : anchorNode;
  const block = anchorEl && anchorEl.closest ? anchorEl.closest('.line-block') : null;
  if(!block || block.dataset.type!=='parenthetical') return;
  if(!content.contains(block)) return;
  if(!block.contains(range.startContainer) || !block.contains(range.endContainer)) return;
  const text=block.textContent, len=text.length;
  if(len<2) return;
  const minO=1, maxO=len-1;
  const so=flatOffsetInBlock(block, range.startContainer, range.startOffset);
  const eo=flatOffsetInBlock(block, range.endContainer, range.endOffset);
  const cso=clamp(so,minO,maxO), ceo=clamp(eo,minO,maxO);
  if(cso===so && ceo===eo) return;
  const startPos=textOffsetToNodeOffset(block, cso);
  const endPos=textOffsetToNodeOffset(block, ceo);
  const nr=document.createRange();
  nr.setStart(startPos.node, startPos.offset);
  nr.setEnd(endPos.node, endPos.offset);
  sel.removeAllRanges();
  sel.addRange(nr);
}
document.addEventListener('selectionchange', clampParentheticalCaret);
function placeCaretAtStart(el){
  if(!el || !document.contains(el)) return;
  const r=document.createRange();
  if(el.firstChild) r.setStart(el.firstChild,0); else r.setStart(el,0);
  r.collapse(true);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function placeCaretAt(el, offset){
  if(!el || !document.contains(el)) return;
  const r=document.createRange();
  if(el.firstChild && el.firstChild.nodeType===3){
    r.setStart(el.firstChild, clamp(offset,0,el.firstChild.length));
  } else { r.setStart(el,0); }
  r.collapse(true);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function placeCaretAtEnd(el){
  if(!el || !document.contains(el)) return;
  const r=document.createRange();
  r.selectNodeContents(el);
  r.collapse(false);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function setBlockType(block,type){
  block.dataset.type=type; block.dataset.label=TYPE_LABELS[type];
  block.className='line-block type-'+type;
  if(type==='parenthetical'){
    const t=block.textContent;
    if(!(t.length>=2 && t.charAt(0)==='(' && t.charAt(t.length-1)===')')){
      const sel=window.getSelection();
      const hadFocusHere = sel && sel.rangeCount>0 && block.contains(sel.getRangeAt(0).startContainer);
      const inner=t.replace(/^\(+/,'').replace(/\)+$/,'');
      block.textContent='('+inner+')';
      if(hadFocusHere) placeCaretAt(block, block.textContent.length-1);
    }
  }
}
function cycleType(block,dir){
  const idx=TYPES.indexOf(block.dataset.type);
  const next=TYPES[(idx+dir+TYPES.length)%TYPES.length];
  setBlockType(block,next);
  scheduleReflow(); scheduleSnapshot(); scheduleAutosave();
}
function splitToNewLine(block, sel, newType){
  const range=sel.getRangeAt(0);
  range.deleteContents();
  const afterRange=document.createRange();
  afterRange.setStart(range.startContainer, range.startOffset);
  afterRange.setEnd(block, block.childNodes.length);
  const afterFrag=afterRange.extractContents(); // preserves any Bold/Italic/etc still open at the split point
  const newBlock=createLineElement({type:newType, text:''});
  newBlock.innerHTML='';
  newBlock.appendChild(afterFrag);
  block.after(newBlock);
  placeCaretAtStart(newBlock);
  scheduleReflow(); scheduleSnapshot(); scheduleAutosave();
  return newBlock;

function handleEnter(block, sel){
  // Final Draft-style shortcut: pressing Enter again on a still-empty line that
  // was itself just created by an Enter-from-Dialogue jumps straight to
  // Character (Dialogue -> Enter -> Enter -> Character), instead of piling up
  // blank Action lines — handy for rapid back-and-forth dialogue exchanges.
  if(block.dataset.type==='action' && block.dataset.fromDialogueEnter==='1' && block.textContent.trim()===''){
    setBlockType(block, 'character');
    refreshToolbarForBlock(block);
    scheduleReflow(); scheduleSnapshot(); scheduleAutosave();
    return;
  }
  const newType=ENTER_MAP[block.dataset.type]||block.dataset.type;
  const wasDialogue=block.dataset.type==='dialogue';

function mergeBlocks(prev, block){

  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
  scheduleReflow(); scheduleSnapshot(); scheduleAutosave();
}
/* An empty Parenthetical "()" serves no purpose — Backspace or Delete pressed

   whole line rather than just being blocked. Backspace lands the caret at the
   end of the previous line (like a normal merge); Delete lands it at the
   start of the next line. */
function removeEmptyParenthetical(block, direction){
  const prev=block.previousElementSibling, next=block.nextElementSibling;
  const hasPrev = prev && prev.classList.contains('line-block');
  const hasNext = next && next.classList.contains('line-block');
  let target=null, atEnd=true;
  if(direction==='backspace'){
    if(hasPrev){ target=prev; atEnd=true; } else if(hasNext){ target=next; atEnd=false; }
  } else {
    if(hasNext){ target=next; atEnd=false; } else if(hasPrev){ target=prev; atEnd=true; }
  }

  if(target){ if(atEnd) placeCaretAtEnd(target); else placeCaretAt(target, 0); }

/* A Parenthetical's own "(...)" must never be split across two lines by a line-creating
   operation (Enter or Tab-jump). If the caret is currently inside a parenthetical, move it
   to the end of the line first so the whole "(...)" stays together on its own line.
   A Character line's own trailing extension "(...)" (e.g. "BOB (V.O.)") gets the same
   protection: if the caret sits anywhere inside it when Enter is pressed, the brackets stay
   fixed and whole — the caret jumps to the end of the line first, same as a Parenthetical. */
function protectParenSplit(block, sel){
  if(block.dataset.type==='parenthetical'){
    placeCaretAtEnd(block);
    return window.getSelection();
  }
  const ext=characterExtensionRange(block);
  if(ext && sel && sel.rangeCount){
    const r=sel.getRangeAt(0);
    const off=flatOffsetInBlock(block, r.startContainer, r.startOffset);
    if(off>ext.openIdx && off<=ext.closeIdx){

      return window.getSelection();

/* Character-line extensions — e.g. "BOB (V.O.)", "BOB (CONT'D)" — get the
   same "brackets aren't individually editable" protection as a real
   Parenthetical line, but scoped to just the trailing "(...)" span rather
   than the whole line (the character's name must stay freely editable).
   Only a single, complete trailing "(...)" group is recognized. */
function characterExtensionRange(block){
  if(block.dataset.type!=='character') return null;
  const text=block.textContent;
  if(!text.endsWith(')')) return null;
  const openIdx=text.lastIndexOf('(');
  if(openIdx<0) return null;
  const closeIdx=text.length-1;
  if(closeIdx<=openIdx) return null;
  return {openIdx, closeIdx};

function placeCaretAtFlatOffset(block, flatOffset){
  const pos=textOffsetToNodeOffset(block, flatOffset);

  r.setStart(pos.node, pos.offset); r.collapse(true);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);

  const endPos=textOffsetToNodeOffset(block, ext.closeIdx+1);
  const r=document.createRange();
  r.setStart(startPos.node, startPos.offset);
  r.setEnd(endPos.node, endPos.offset);
  r.deleteContents();
  placeCaretAtFlatOffset(block, ext.openIdx);
  scheduleReflow(); scheduleSnapshot(); scheduleAutosave();

/* Typing "(" for a Character-line extension immediately after the name with

   and the opening paren, matching Final Draft's own convention
   ("BOB (V.O."), so the writer doesn't have to remember to space it
   themselves. Only fires for a genuinely fresh "(" with nothing but
   non-whitespace text directly before it -- one already preceded by
   whitespace (or at the very start of the line) is left alone, so this
   can never stack up extra spaces. Runs before autoCloseCharacterExtension
   in the input handler; that function re-reads the live selection itself,
   so the caret shift from the inserted space doesn't need to be threaded
   through by hand. */
function autoSpaceBeforeExtension(block){

  const sel=window.getSelection();
  if(!sel || !sel.rangeCount || !sel.getRangeAt(0).collapsed) return;
  const range=sel.getRangeAt(0);
  const caretOffset=flatOffsetInBlock(block, range.startContainer, range.startOffset);
  const text=block.textContent;
  if(caretOffset<2 || text[caretOffset-1]!=='(') return; // need a just-typed "(" with something before it
  const before=text[caretOffset-2];
  if(!before || /\s/.test(before)) return; // already spaced, or nothing to space from
  const pos=textOffsetToNodeOffset(block, caretOffset-1);

  r.setStart(pos.node, pos.offset); r.setEnd(pos.node, pos.offset);
  r.insertNode(document.createTextNode(' '));

/* Auto-pairs "(" on a Character line, the same way Tab pre-fills a fresh
   Parenthetical with "()" — typing the opening bracket of an extension like
   "(V.O." immediately gets its closing ")" inserted, cursor left in between. */
function autoCloseCharacterExtension(block){
  if(block.dataset.type!=='character') return;
  const sel=window.getSelection();
  if(!sel || !sel.rangeCount || !sel.getRangeAt(0).collapsed) return;
  const range=sel.getRangeAt(0);
  const caretOffset=flatOffsetInBlock(block, range.startContainer, range.startOffset);
  const text=block.textContent;
  if(caretOffset<1 || text[caretOffset-1]!=='(' || text[caretOffset]===')') return;
  const pos=textOffsetToNodeOffset(block, caretOffset);
  const r=document.createRange();
  r.setStart(pos.node, pos.offset); r.setEnd(pos.node, pos.offset);
  r.insertNode(document.createTextNode(')'));
  placeCaretAtFlatOffset(block, caretOffset);

/* Character-level Bold/Italic/Underline/Strikethrough on the live text selection (or, if the
   caret is collapsed, on whatever gets typed next) — used by both the toolbar buttons and the

   line's innerHTML (see createLineElement / serializeLines) so formatting survives reload,
   undo/redo, and splitting/merging lines. */
const INLINE_COMMANDS={bold:'bold', italic:'italic', underline:'underline', strike:'strikeThrough'};

  document.execCommand(INLINE_COMMANDS[kind]||kind, false, null);
  scheduleReflow(); scheduleSnapshot(); scheduleAutosave();

/* Auto-detect INT. / EXT. / INT./EXT. at the start of a line and retype it as a Scene Heading. */
const SCENE_HEADING_PREFIX_RE=/^(int\.\/ext\.|int\.|ext\.)\s?$/i;
function autoDetectSceneHeading(block){
  if(!block || block.dataset.type==='scene_heading') return;
  if(SCENE_HEADING_PREFIX_RE.test(block.textContent)){
    setBlockType(block,'scene_heading');
    refreshToolbarForBlock(block);
  }
}
function pasteLines(block, sel, rawLines){
  const range=sel.getRangeAt(0);
  range.deleteContents();

  if(rawLines.length<=1){
    const textNode=document.createTextNode(rawLines[0]||'');
    range.insertNode(textNode);
    const r=document.createRange();
    r.setStartAfter(textNode); r.collapse(true);
    const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
  } else {
    // Preserve whatever formatting is still "open" after the cursor by extracting it as a
    // fragment first, then re-attaching it to the very last pasted line (matches the old
    // beforeText / afterText split, but keeps Bold/Italic/etc. intact instead of flattening
    // everything through textContent).
    const afterRange=document.createRange();
    afterRange.setStart(range.startContainer, range.startOffset);
    afterRange.setEnd(block, block.childNodes.length);
    const afterFrag=afterRange.extractContents();

    block.appendChild(document.createTextNode(rawLines[0]));
    let cursor=block;
    for(let i=1;i<rawLines.length;i++){
      const isLast=(i===rawLines.length-1);
      const nb=createLineElement({type: isLast?block.dataset.type:'action', text: rawLines[i]});
      if(isLast){ nb.appendChild(afterFrag); }

function htmlToFragment(html){

  while(tmp.firstChild) frag.appendChild(tmp.firstChild);

/* Rich, same-app paste: richLines is [{type, html, align}, ...] as built by

   portion). Structurally mirrors pasteLines above -- the first segment
   merges straight into the current block (keeping ITS type, exactly like a
   plain-text paste: you're continuing to type into whatever line the cursor
   was already in) and whatever was still after the cursor keeps flowing
   into the last newly-created line -- except every genuinely NEW line
   (i = 1..N-1, including the last) now takes on its OWN copied type and
   alignment instead of being forced to Action, and every line's inner HTML
   (not just plain text) is carried over, so Bold/Italic/Underline/
   Strikethrough spans survive the round trip too. */
function pasteRichLines(block, sel, richLines){
  const range=sel.getRangeAt(0);
  range.deleteContents();

  if(richLines.length<=1){
    const frag=htmlToFragment(richLines[0] ? richLines[0].html : '');
    const lastNode=frag.lastChild;
    range.insertNode(frag);
    const r=document.createRange();
    if(lastNode){ r.setStartAfter(lastNode); r.collapse(true); }
    else { r.setStart(range.startContainer, range.startOffset); r.collapse(true); }
    const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
  } else {
    const afterRange=document.createRange();
    afterRange.setStart(range.startContainer, range.startOffset);
    afterRange.setEnd(block, block.childNodes.length);
    const afterFrag=afterRange.extractContents();

    block.appendChild(htmlToFragment(richLines[0].html));
    let cursor=block;
    for(let i=1;i<richLines.length;i++){
      const isLast=(i===richLines.length-1);
      const nb=createLineElement({type:richLines[i].type, html:richLines[i].html, align:richLines[i].align});
      if(isLast){ nb.appendChild(afterFrag); }
      cursor.after(nb); cursor=nb;
    }
    placeCaretAtStart(cursor);

/* Computes the portion of `block` actually covered by the overall selection
   `range` -- the whole block for one fully inside the selection, or just the
   selected slice for the first/last block of a multi-line selection that
   starts or ends mid-paragraph. */
function rangeIntersectionWithinBlock(range, block){
  const r=document.createRange();
  r.selectNodeContents(block);
  if(range.compareBoundaryPoints(Range.START_TO_START, r) > 0) r.setStart(range.startContainer, range.startOffset);
  if(range.compareBoundaryPoints(Range.END_TO_END, r) < 0) r.setEnd(range.endContainer, range.endOffset);
  return r;
}
/* Copy/cut inside the script: captures each touched line's element type,
   alignment, and formatted HTML into a custom clipboard format alongside the
   normal plain text, so pasting back into Novel Dots (see pasteRichLines
   above) can restore the original element types and formatting instead of
   flattening everything to Action lines the way a plain-text-only paste
   must. Pasting into anything else (another app, or a plain text field)
   still only ever sees the ordinary text/plain fallback. */
function handleScriptCopyOrCut(e, isCut){
  const sel=window.getSelection();
  if(!sel || !sel.rangeCount || sel.isCollapsed) return; // nothing selected -- let the browser do its default thing
  const range=sel.getRangeAt(0);
  if(!content.contains(range.commonAncestorContainer)) return; // selection isn't in the script (e.g. a note body) -- don't intercept
  const blocks=Array.from(content.querySelectorAll('.line-block')).filter(b=>range.intersectsNode(b));
  if(!blocks.length) return;
  const payload=blocks.map(b=>{
    const sub=rangeIntersectionWithinBlock(range, b);
    const frag=sub.cloneContents();
    frag.querySelectorAll('.dlg-gap-spacer').forEach(n=>n.remove()); // purely visual page-split artifact -- never copy it
    const div=document.createElement('div');
    div.appendChild(frag);
    return {type:b.dataset.type, html:div.innerHTML, align:b.dataset.align||null, text:div.textContent};
  });
  e.clipboardData.setData('text/plain', payload.map(p=>p.text).join('\n'));
  e.clipboardData.setData('application/x-novel-dots-lines', JSON.stringify(payload));
  e.preventDefault();
  if(isCut){
    if(readOnlyMode) return; // shouldn't normally be reachable (content is already non-editable), but don't mutate if it somehow is

    scheduleReflow(); scheduleSnapshot(); scheduleAutosave();
  }
}

content.addEventListener('keydown', function(e){
  if(readOnlyMode){
    // Let pure navigation keys move the caret/selection for reading; block
    // every other key (typing, Tab/Enter structural jumps, Ctrl+1-9 retype,
    // Cmd+N note creation, Bold/Italic/etc.) since all of them mutate the
    // script or the project.
    const navKeys=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'];
    if(!navKeys.includes(e.key)){ e.preventDefault(); }
    return;
  }
  const sel=window.getSelection();
  if(!sel || !sel.rangeCount) return;
  const block=getCurrentBlock(sel);
  if(!block) return;

  const mod=e.ctrlKey||e.metaKey;
  if(mod && !e.shiftKey && (e.key==='n' || e.key==='N')){
    e.preventDefault();
    createNoteForBlock('dot', block);
    return;
  }
  if(mod && e.shiftKey && (e.key==='n' || e.key==='N')){
    e.preventDefault();
    createNoteForBlock('sticky', block);
    return;
  }
  if(mod && NUMBER_TYPE_MAP[e.key] && !e.shiftKey){
    e.preventDefault();
    setBlockType(block, NUMBER_TYPE_MAP[e.key]);
    scheduleReflow(); scheduleSnapshot(); scheduleAutosave(); ensureCaretVisible();
    return;
  }
  if(mod && e.shiftKey && SHIFT_NUMBER_TYPE_MAP[e.key]){
    e.preventDefault();
    setBlockType(block, SHIFT_NUMBER_TYPE_MAP[e.key]);
    scheduleReflow(); scheduleSnapshot(); scheduleAutosave(); ensureCaretVisible();
    return;
  }
  if(mod && !e.shiftKey && (e.key==='b'||e.key==='B')){ e.preventDefault(); applyInlineFormat('bold'); return; }
  if(mod && !e.shiftKey && (e.key==='i'||e.key==='I')){ e.preventDefault(); applyInlineFormat('italic'); return; }
  if(mod && !e.shiftKey && (e.key==='u'||e.key==='U')){ e.preventDefault(); applyInlineFormat('underline'); return; }
  if(e.key==='Tab'){
    e.preventDefault();
    if(!e.shiftKey && block.dataset.type==='action' && block.dataset.fromDialogueEnter==='1' && block.textContent.trim()===''){
      // Same shortcut as the double-Enter case: retype this still-empty line in
      // place as Character rather than splitting off a new (redundant) line.
      setBlockType(block, 'character');
      refreshToolbarForBlock(block);
      scheduleReflow(); scheduleSnapshot(); scheduleAutosave(); ensureCaretVisible();
      return;
    }
    if(!e.shiftKey && block.dataset.type==='parenthetical' && block.dataset.fromDialogueTab==='1' && block.textContent==='()'){
      // Pressing Tab a second time on the still-untouched "()" that the first
      // Tab (Dialogue -> Parenthetical) just created: replace it in place with
      // an empty Character line on the same line, rather than leaving the
      // parenthetical behind or splitting off a further new line.
      block.textContent='';
      setBlockType(block, 'character');
      refreshToolbarForBlock(block);
      scheduleReflow(); scheduleSnapshot(); scheduleAutosave(); ensureCaretVisible();
      return;
    }
    if(!e.shiftKey && TAB_JUMP_MAP[block.dataset.type]){
      const newType=TAB_JUMP_MAP[block.dataset.type];
      const wasDialogue=block.dataset.type==='dialogue';
      const jumpSel=protectParenSplit(block, sel);
      const newBlock=splitToNewLine(block, jumpSel, newType);
      if(newType==='parenthetical' && newBlock.textContent===''){
        newBlock.textContent='()';
        placeCaretAt(newBlock, 1);
        if(wasDialogue) newBlock.dataset.fromDialogueTab='1';
        scheduleReflow(); scheduleSnapshot(); scheduleAutosave();
      }
    } else {
      cycleType(block, e.shiftKey?-1:1);
    }
    ensureCaretVisible();

  }

    e.preventDefault();

    handleEnter(block, enterSel);
    ensureCaretVisible();
    return;
  }

    if(block.dataset.type==='parenthetical'){
      const r=sel.getRangeAt(0);
      if(r.collapsed && flatOffsetInBlock(block, r.startContainer, r.startOffset)<=1){
        e.preventDefault();
        if(block.textContent==='()'){ removeEmptyParenthetical(block, 'backspace'); ensureCaretVisible(); }

      }

    const charExt=characterExtensionRange(block);
    if(charExt){
      const r=sel.getRangeAt(0);
      if(r.collapsed){
        const off=flatOffsetInBlock(block, r.startContainer, r.startOffset);
        if(off===charExt.openIdx+1 || off===charExt.closeIdx+1){
          e.preventDefault();
          if(charExt.closeIdx===charExt.openIdx+1){ removeCharacterExtension(block, charExt); ensureCaretVisible(); }
          return;
        }
      }
    }
    const range=sel.getRangeAt(0);
    if(range.collapsed && isCaretAtStart(block,range)){
      const prev=block.previousElementSibling;
      if(prev && prev.classList.contains('line-block')){
        e.preventDefault();
        mergeBlocks(prev, block);
        ensureCaretVisible();
      }
    }
    return;
  }
  if(e.key==='Delete'){
    if(block.dataset.type==='parenthetical'){
      const r=sel.getRangeAt(0);
      if(r.collapsed){
        const len=block.textContent.length;

          return;

    if(charExt){
      const r=sel.getRangeAt(0);
      if(r.collapsed){
        const off=flatOffsetInBlock(block, r.startContainer, r.startOffset);
        if(off===charExt.openIdx || off===charExt.closeIdx){
          e.preventDefault();
          if(charExt.closeIdx===charExt.openIdx+1){ removeCharacterExtension(block, charExt); ensureCaretVisible(); }
          return;
        }
      }
    }
    return;
  }
});
content.addEventListener('input', function(){
  const sel=window.getSelection();

content.addEventListener('cut', function(e){ handleScriptCopyOrCut(e, true); });
content.addEventListener('paste', function(e){
  e.preventDefault();

content.addEventListener('dblclick', function(){

content.addEventListener('mouseover', function(e){

/* =========================================================
   PAGINATION
   ========================================================= */
let _lastPaginationSig=null;
/* Set by removeDialogueSplit() whenever it actually strips a rendered
   (MORE)/(CONT'D) break from the DOM (the live-editing safety net). That DOM
   change happens independent of recomputePagination's own break-signature
   bookkeeping, so if the *next* pagination pass computes the exact same
   signature as before (a very common case — small edits, or edits that
   don't shift where any page break falls), the signature-cache fast path
   would otherwise skip all DOM mutation and the split would never be
   re-inserted. This flag forces exactly one bypass of that cache so the
   split reliably reappears once the user moves on, as documented. */
let _forcePaginationRebuild=false;
/* Mirrors _lastPaginationSig, but for Continuous View's own pagination pass
   (recomputePaginationContinuous) -- see there for why it needs its own
   cache check rather than sharing this one. */
let _lastContinuousSig=null;
/* Continuous Page View: when true, pagination never inserts page-spacers or
   dialogue (MORE)/(CONT'D) splits -- the whole document flows as one
   unbroken column. Page NUMBER labels still appear at the same vertical
   spots normal pagination would have put them (see recomputePaginationContinuous),
   they just float within a single continuous paper sheet instead of at the
   top of separate physical pages. */
let continuousView=false;
let continuousPageBoundaries=[]; // ascending world-Y positions where each numbered page begins
/* A block's height "as if it had no visual dialogue-split break in it" —
   letting the split's own injected element skip being counted, so pagination
   decisions are stable regardless of whether a split currently happens to be
   rendered (never needs to remove it just to measure). */
function naturalBlockHeight(el){
  const spacer=el.querySelector('.dlg-gap-spacer');
  if(!spacer) return el.offsetHeight||16;
  return Math.max(16,(el.offsetHeight||16)-(spacer.offsetHeight||0));
}
function lineOwnPaddingTop(el){
  if(el.dataset.type==='dialogue' || el.dataset.type==='parenthetical') return 0;
  if(el===content.firstElementChild) return 0;
  return 16;
}
/* Removes a Dialogue block's invisible gap-spacer (the only DOM node the
   split ever inserts into the block's *editable* text flow -- see the
   PAGINATION section below for why the "(MORE)"/"CONT'D" labels themselves
   are never inserted here at all). Structural text-offset operations
   (Find/Replace) call this first so their offset math runs against the
   block's plain, unbroken text; pagination itself removes and rebuilds
   spacers wholesale on every pass regardless. */
function removeDialogueSplit(block){
  const existing=block.querySelectorAll('.dlg-gap-spacer');
  if(existing.length){
    existing.forEach(n=>n.remove());
    _forcePaginationRebuild=true;
  }
  if(dialogueLabelsLayer && block.dataset.id){

function findPrecedingCharacterName(dialogueBlock){
  let el=dialogueBlock.previousElementSibling, hops=0;
  while(el && hops<6){
    if(el.classList && el.classList.contains('line-block')){
      if(el.dataset.type==='character') return cleanBlockText(el).trim();
      if(el.dataset.type==='scene_heading' || el.dataset.type==='transition') return null;
    }
    el=el.previousElementSibling; hops++;
  }
  return null;
}
/* Final Draft-style dialogue continuation: is there a good place to break
   this Dialogue block's wrapped text so it can continue onto the next page
   with "(MORE)" here and "CHARACTER (CONT'D)" there, instead of the whole
   block just moving down (wasting whatever room *was* left on this page)?
   Read-only — only measures the block's current natural rendering
   (Range.getClientRects() + caretRangeFromPoint), never mutates the DOM, so
   it's safe to call speculatively while just checking whether anything
   changed before committing to a real pagination pass. */
function computeDialogueSplitOffset(dialogueBlock, spaceLeft){
  if(spaceLeft < LINE_H*2) return null; // need room for at least one real line plus "(MORE)"
  // If a split from a previous pass is still sitting in this block, hide it
  // just for this measurement (synchronously restored below) so the rect
  // analysis reflects the block's natural, unsplit wrapping — otherwise the
  // spacer's own rects would contaminate the line-by-line scan.
  const existingSpacer=dialogueBlock.querySelector('.dlg-gap-spacer');
  if(existingSpacer) existingSpacer.style.display='none';
  try{
    const range=document.createRange();
    range.selectNodeContents(dialogueBlock);
    let rects;
    try{ rects=Array.from(range.getClientRects()).filter(r=>r.height>0.5); }catch(e){ return null; }
    if(rects.length<2) return null; // fits on one wrapped line already — nothing to split
    const blockTop=dialogueBlock.getBoundingClientRect().top;
    let splitIdx=-1;
    for(let li=0; li<rects.length; li++){
      if((rects[li].bottom-blockTop)/zoom > (spaceLeft-MORE_LABEL_H)){ splitIdx=li; break; }
    }
    if(splitIdx<=0) return null; // nothing fits, or the whole thing already fits
    // Find the text offset at the start of the first non-fitting visual line
    // via binary search over collapsed-Range rects (Range.getClientRects()
    // reflects layout regardless of scroll position) rather than
    // document.caretRangeFromPoint(), which does an actual point-based hit
    // test against currently-painted pixels — it silently fails (returns
    // null) for anything scrolled out of the visible viewport, which is the
    // common case once a document has any real amount of content.
    const targetTop=rects[splitIdx].top;
    const textLen=dialogueBlock.textContent.length;
    function offsetTop(offset){
      const pos=textOffsetToNodeOffset(dialogueBlock, offset);
      const r=document.createRange();
      r.setStart(pos.node, pos.offset); r.setEnd(pos.node, pos.offset);
      const rs=r.getClientRects();
      return rs.length ? rs[0].top : r.getBoundingClientRect().top;
    }
    let lo=1, hi=textLen;
    while(lo<hi){
      const mid=(lo+hi)>>1;
      if(offsetTop(mid) < targetTop-1){ lo=mid+1; } else { hi=mid; }
    }
    let off=lo;
    // Snap back to the nearest preceding word boundary — the binary search
    // finds *a* character offset on the right visual line, but inserting the
    // break element exactly there (mid-word) can render differently than the
    // original continuous wrapping did. Splitting exactly at the whitespace
    // between words always matches how the text was already wrapping.
    const fullText=dialogueBlock.textContent;
    let snapped=off;
    while(snapped>0 && !/\s/.test(fullText[snapped-1])) snapped--;
    if(snapped>0) off=snapped;
    if(off<=0 || off>=textLen) return null;
    return { offset:off, beforeHeight: (rects[splitIdx-1].bottom-blockTop)/zoom, afterHeight: (rects[rects.length-1].bottom-rects[splitIdx].top)/zoom };
  } finally {
    if(existingSpacer) existingSpacer.style.display='';
  }
}
/* Inserts ONLY an empty, non-editable, text-free gap-spacer at the split
   offset — Range.insertNode() on a collapsed range cleanly splits whichever
   text node is there and sandwiches the spacer between the two halves, so
   the block's own text is never altered, just visually pushed apart. Sized
   to the FULL combined height the old moreLabel+gap+contdLabel used to take
   (MORE_LABEL_H + remainder + M_BOTTOM+GAP+M_TOP + CONTD_LABEL_H) since the
   actual "(MORE)"/"CONT'D" *text* is never inserted here at all — see
   renderDialogueLabelsLayer, which draws it as a purely visual overlay in a
   completely separate layer outside the contenteditable region. Because
   that overlay lives outside #screenplayContent's own DOM subtree entirely,
   it is structurally impossible for it to be included when the user
   selects and copies script text — no user-select CSS trickery needed, and
   nothing here is at risk from Backspace/Delete/Enter the way a real
   contenteditable=false *text-bearing* island would be. */
function buildDialogueGapSpacer(block, offset, spaceLeft, beforeHeight){
  const pos=textOffsetToNodeOffset(block, offset);
  const r=document.createRange();
  r.setStart(pos.node, pos.offset); r.setEnd(pos.node, pos.offset);
  const spacer=document.createElement('span');
  spacer.className='dlg-gap-spacer';
  spacer.contentEditable='false';
  spacer.setAttribute('aria-hidden','true');
  const remainder=Math.max(0, spaceLeft-beforeHeight-MORE_LABEL_H);
  spacer.style.height=(MORE_LABEL_H+remainder+M_BOTTOM+GAP+M_TOP+CONTD_LABEL_H)+'px';
  r.insertNode(spacer);
  return spacer;
}
/* Draws the "(MORE)" / "CHARACTER (CONT'D)" labels for every current

   of it, so these labels are never part of the editable DOM the user is

function renderDialogueLabelsLayer(dialogueSplits){
  dialogueLabelsLayer.innerHTML='';
  dialogueSplits.forEach(d=>{
    const spacer=d.block.querySelector('.dlg-gap-spacer');
    if(!spacer) return;
    const blockId=d.block.dataset.id;
    const charName=findPrecedingCharacterName(d.block);
    const spacerRect=spacer.getBoundingClientRect();
    const spacerTop=screenToWorld(spacerRect.left, spacerRect.top).y;
    const more=document.createElement('div');
    more.className='dlg-more-label-overlay';
    more.dataset.forBlock=blockId;
    more.textContent=MORE_TEXT;
    more.style.top=spacerTop+'px';
    dialogueLabelsLayer.appendChild(more);
    const contd=document.createElement('div');
    contd.className='dlg-contd-label-overlay';
    contd.dataset.forBlock=blockId;
    contd.textContent=(charName?charName+' ':'')+"(CONT'D)";
    contd.style.top=(spacerTop+spacer.offsetHeight-CONTD_LABEL_H)+'px';
    dialogueLabelsLayer.appendChild(contd);
  });
}
function recomputePagination(){
  const blocks=Array.from(content.children).filter(el=>el.classList.contains('line-block'));
  if(continuousView){ recomputePaginationContinuous(blocks); return; }
  if(!blocks.length){
    content.querySelectorAll('.page-spacer').forEach(n=>n.remove());
    content.querySelectorAll('.dlg-gap-spacer').forEach(n=>n.remove());
    if(dialogueLabelsLayer) dialogueLabelsLayer.innerHTML='';
    _lastPaginationSig=null; _forcePaginationRebuild=false; renderPageDecor(1,1); totalPageCount=1; updatePageIndicator(); return;
  }

  // Measure natural (unspaced, unsplit) heights — spacers and any existing
  // dialogue-split break don't affect this, so no need to remove them first.
  const heights=blocks.map(el=>naturalBlockHeight(el));

  let used=0, pageStart=0;
  const breaks=[];          // {beforeEl, remainder} — a normal page spacer
  const dialogueSplits=[];  // {block, offset, spaceLeft, beforeHeight} — an internal (MORE)/(CONT'D) break

  for(let i=0;i<blocks.length;i++){
    used+=heights[i];
    const heightBreak = used>BUDGET && i>pageStart;
    const forcedBreak = !heightBreak && blocks[i].dataset.forceBreak==='1' && i+1<blocks.length;
    if(heightBreak){
      // Check dialogue-split viability FIRST, before orphan control gets a
      // chance to claim this case — a Dialogue block is *always* preceded by
      // a Character cue, so if orphan control ran first it would shadow the
      // split path entirely, moving the whole cue+dialogue pair down instead
      // of ever trying a Final Draft-style (MORE)/(CONT'D) continuation.
      if(blocks[i].dataset.type==='dialogue'){
        const spaceLeft=BUDGET-(used-heights[i]);
        const split=computeDialogueSplitOffset(blocks[i], spaceLeft);
        if(split){
          dialogueSplits.push({block:blocks[i], offset:split.offset, spaceLeft, beforeHeight:split.beforeHeight});
